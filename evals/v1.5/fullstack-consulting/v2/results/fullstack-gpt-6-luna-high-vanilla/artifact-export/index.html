<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DepotFlow</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color:#172331;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}header{background:#16354c;color:#fff;padding:1rem max(1rem,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:1.35rem}.wrap{max-width:1100px;margin:1.3rem auto;padding:0 1rem}button,input,select{font:inherit;padding:.55rem .7rem;border:1px solid #aab8c2;border-radius:5px}button{background:#176b87;color:white;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#536674}nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}nav button[aria-current=page]{background:#102d43}.card{background:white;border:1px solid #d8e0e5;border-radius:8px;padding:1rem;margin:0 0 1rem;box-shadow:0 1px 3px #152b3810}h2{margin:.1rem 0 .9rem;font-size:1.2rem}h3{margin:.5rem 0}.row{display:flex;gap:.65rem;align-items:end;flex-wrap:wrap}.field{display:grid;gap:.25rem}table{border-collapse:collapse;width:100%;font-size:.94rem}th,td{text-align:left;padding:.55rem;border-bottom:1px solid #e2e8eb}th{background:#f6f8f9}.scroll{overflow:auto}.muted{color:#586b78}.error{padding:.7rem;background:#fff0ec;color:#922d1d;border-radius:5px;margin:.6rem 0}.success{color:#17623e}.status{font-weight:650;text-transform:capitalize}.line{display:flex;gap:.5rem;align-items:end;margin:.5rem 0}.line select{min-width:180px}.line input{width:110px}.hidden{display:none!important}.orderlist button.link{background:transparent;color:#075f84;padding:0;text-decoration:underline}.spacer{flex:1}.badge{padding:.2rem .5rem;border-radius:99px;background:#e8f2f6}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.login{max-width:430px;margin:10vh auto}#toast{min-height:1.3em}
@media(max-width:600px){header{padding:.8rem 1rem}.wrap{margin:.7rem auto;padding:0 .65rem}.card{padding:.75rem}table{min-width:520px}.line{align-items:stretch}.line select{min-width:0;flex:1}.line input{width:85px}}
</style></head><body><header><h1>DepotFlow <small style="font-size:.7em;font-weight:400">Fulfillment</small></h1><div id="identity"></div><button id="logout" class="secondary hidden" data-testid="logout">Log out</button></header>
<main class="wrap"><div id="notice" role="status" aria-live="polite"></div><section id="login" class="card login"><h2>Sign in</h2><form id="login-form"><div class="field"><label for="email">Email</label><input id="email" data-testid="login-email" type="email" required autocomplete="username" value="operator@north.example"></div><div class="field" style="margin-top:.7rem"><label for="password">Password</label><input id="password" data-testid="login-password" type="password" required autocomplete="current-password" value="DepotDemo!2026"></div><button data-testid="login-submit" style="margin-top:1rem">Sign in</button></form></section>
<section id="app" class="hidden"><nav aria-label="Main navigation"><button data-view="inventory" data-testid="nav-inventory">Inventory</button><button data-view="orders" data-testid="nav-orders">Orders</button><button data-view="audit" data-testid="nav-audit">Audit</button></nav><section id="inventory-view" class="view"></section><section id="orders-view" class="view hidden"></section><section id="audit-view" class="view hidden"></section></section></main>
<script>
(()=>{'use strict';let token=sessionStorage.getItem('token')||'',me=null,inventory=[],orders=[],selected=null,lines=[{sku:'BOLT',quantity:1}],busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),note=(m,bad=false)=>{$('#notice').innerHTML=m?`<div class="${bad?'error':'success'}" role="status">${esc(m)}</div>`:''},uuid=()=>crypto.randomUUID();
async function api(path,opt={}){let headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;let r=await fetch('/api'+path,{...opt,headers});let x=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(x.error?.message||`Request failed (${r.status})`),{status:r.status,code:x.error?.code});return x}
function view(name){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==name+'-view'));document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.view===name?'page':'false'));if(name==='inventory')loadInventory();if(name==='orders')loadOrders();if(name==='audit')loadAudit()}
async function start(){if(!token)return;try{me=await api('/me');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#identity').textContent=`${me.email} · ${me.role}`;view('inventory')}catch{sessionStorage.removeItem('token');token=''}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();let b=$('[data-testid=login-submit]');b.disabled=true;note('Signing in…');try{let x=await api('/session',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=x.token;sessionStorage.setItem('token',token);note('Signed in');await start()}catch(x){note(x.message,true)}finally{b.disabled=false}});
$('#logout').onclick=()=>{token='';me=null;sessionStorage.removeItem('token');$('#app').classList.add('hidden');$('#logout').classList.add('hidden');$('#identity').textContent='';$('#login').classList.remove('hidden');note('Signed out')};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));
async function loadInventory(){let root=$('#inventory-view');root.innerHTML='<div class="card">Loading inventory…</div>';try{let [x,d]=await Promise.all([api('/inventory'),api('/dashboard')]);inventory=x.items;root.innerHTML=`<div class="card"><h2>Warehouse dashboard</h2><p>${d.inventory_units} units on hand · ${d.reserved_units} reserved</p><p>${Object.entries(d.orders_by_status).map(([s,n])=>`${esc(s)}: ${n}`).join(' · ')||'No orders yet'}</p></div><div class="card"><h2>Inventory</h2><div class="scroll"><table data-testid="inventory-table"><thead><tr><th>SKU</th><th>Item</th><th>On hand</th><th>Reserved</th><th>Available</th><th>Price</th><th>Version</th></tr></thead><tbody>${inventory.map(i=>`<tr><td>${esc(i.sku)}</td><td>${esc(i.name)}</td><td>${i.on_hand}</td><td>${i.reserved}</td><td>${i.available}</td><td>$${(i.price_cents/100).toFixed(2)}</td><td>${i.version}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){root.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
async function loadOrders(){let root=$('#orders-view');root.innerHTML=`<div class="card"><div class="row"><h2>Orders</h2><span class="spacer"></span><input id="search" aria-label="Search client reference" placeholder="Search client ref"><select id="filter" aria-label="Filter status"><option value="">All statuses</option>${['draft','reserved','shipped','cancelled','returned'].map(x=>`<option>${x}</option>`).join('')}</select><button id="search-btn">Search</button></div><div id="order-list">Loading orders…</div></div>${me.role==='viewer'?'':`<div class="card"><h2>New order <button type="button" class="secondary" data-testid="new-order">New order</button></h2><form id="new-form"><div class="field"><label for="client-ref">Client reference</label><input id="client-ref" data-testid="order-client-ref" required maxlength="120"></div><div id="lines"></div><div class="actions"><button type="button" class="secondary" data-testid="add-line" id="add-line">Add line</button><button data-testid="submit-order" id="submit-order">Create order</button></div></form></div>`}<div id="detail"></div>`;
 $('#search-btn').onclick=fetchOrders;$('#filter').onchange=fetchOrders;$('#search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fetchOrders()}};if(me.role!=='viewer'){$('#add-line').onclick=()=>{lines.push({sku:'BOLT',quantity:1});renderLines()};renderLines();$('#new-form').onsubmit=createOrder}await fetchOrders()}
function renderLines(){let root=$('#lines');if(!root)return;root.innerHTML=lines.map((l,n)=>`<div class="line"><div class="field"><label>SKU</label><select data-testid="line-sku" data-i="${n}">${inventory.map(i=>`<option ${i.sku===l.sku?'selected':''}>${esc(i.sku)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input data-testid="line-quantity" data-i="${n}" type="number" min="1" step="1" required value="${l.quantity}"></div>${n?`<button type="button" class="secondary remove-line" data-i="${n}" aria-label="Remove line ${n+1}">Remove</button>`:''}</div>`).join('');root.querySelectorAll('[data-testid=line-sku]').forEach(x=>x.onchange=()=>lines[+x.dataset.i].sku=x.value);root.querySelectorAll('[data-testid=line-quantity]').forEach(x=>x.oninput=()=>lines[+x.dataset.i].quantity=Number(x.value));root.querySelectorAll('.remove-line').forEach(x=>x.onclick=()=>{lines.splice(+x.dataset.i,1);renderLines()})}
async function fetchOrders(){let root=$('#order-list');if(!root)return;root.textContent='Loading orders…';try{let q=new URLSearchParams();if($('#filter').value)q.set('status',$('#filter').value);if($('#search').value)q.set('q',$('#search').value);let x=await api('/orders?'+q);orders=x.items;root.innerHTML=orders.length?`<div class="scroll"><table><thead><tr><th>Client ref</th><th>Status</th><th>Lines</th><th>Total</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.client_ref)}</td><td class="status">${esc(o.status)}</td><td>${o.lines.reduce((s,l)=>s+l.quantity,0)}</td><td>$${(o.total_cents/100).toFixed(2)}</td><td><button class="link" data-open="${o.id}">View</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No matching orders.</p>';root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(+b.dataset.open))}catch(e){root.textContent=e.message}}
async function createOrder(e){e.preventDefault();if(busy)return;let b=$('#submit-order');busy=true;b.disabled=true;try{let o=await api('/orders',{method:'POST',headers:{'Idempotency-Key':uuid()},body:JSON.stringify({client_ref:$('#client-ref').value,lines:lines.map(l=>({sku:l.sku,quantity:l.quantity}))})});note(`Order ${o.client_ref} created`);$('#client-ref').value='';lines=[{sku:'BOLT',quantity:1}];renderLines();await fetchOrders();await detail(o.id);await loadInventory()}catch(x){note(x.message,true)}finally{busy=false;b.disabled=false}}
async function detail(id){let root=$('#detail');root.innerHTML='<div class="card">Loading order…</div>';try{let o=await api('/orders/'+id);selected=o;root.innerHTML=`<div class="card" data-testid="order-detail"><h2>Order ${esc(o.client_ref)} <span class="status">${esc(o.status)}</span></h2><p>Order #${o.id} · version ${o.version} · total $${(o.total_cents/100).toFixed(2)}</p><div class="scroll"><table><thead><tr><th>SKU</th><th>Quantity</th><th>Unit price</th><th>Returned</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${esc(l.sku)}</td><td>${l.quantity}</td><td>$${(l.unit_price_cents/100).toFixed(2)}</td><td>${l.returned_quantity}</td></tr>`).join('')}</tbody></table></div>${me.role==='viewer'?'':`<div class="actions" style="margin-top:.8rem">${o.status==='draft'?'<button data-testid="reserve-order" data-action="reserve">Reserve</button><button class="secondary" data-testid="cancel-order" data-action="cancel">Cancel</button>':''}${o.status==='reserved'?'<button data-testid="ship-order" data-action="ship">Ship</button><button class="secondary" data-testid="cancel-order" data-action="cancel">Cancel</button>':''}</div>${o.status==='shipped'?`<form id="return-form"><h3>Return items</h3>${o.lines.filter(l=>l.returned_quantity<l.quantity).map(l=>`<div class="line"><label>${esc(l.sku)} (up to ${l.quantity-l.returned_quantity})</label><input data-testid="return-quantity" data-sku="${esc(l.sku)}" type="number" min="0" max="${l.quantity-l.returned_quantity}" step="1" value="0"></div>`).join('')}<button data-testid="submit-return">Record return</button></form>`:''}`}</div>`;root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>transition(o,b.dataset.action,b));if($('#return-form'))$('#return-form').onsubmit=e=>submitReturn(e,o)}catch(e){root.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
async function transition(o,action,b){if(busy)return;busy=true;b.disabled=true;try{let x=await api(`/orders/${o.id}/${action}`,{method:'POST',headers:{'Idempotency-Key':uuid()},body:JSON.stringify({expected_version:o.version})});note(`Order ${x.client_ref} ${x.status}`);await Promise.all([detail(o.id),fetchOrders(),loadInventory()])}catch(e){note(e.message,true);if(e.code==='stale_version')await detail(o.id)}finally{busy=false}}
async function submitReturn(e,o){e.preventDefault();if(busy)return;let inputs=[...e.currentTarget.querySelectorAll('[data-testid=return-quantity]')],ret=inputs.map(i=>({sku:i.dataset.sku,quantity:Number(i.value)})).filter(x=>x.quantity>0);if(!ret.length){note('Enter at least one return quantity',true);return}let b=e.currentTarget.querySelector('button');busy=true;b.disabled=true;try{let x=await api(`/orders/${o.id}/returns`,{method:'POST',headers:{'Idempotency-Key':uuid()},body:JSON.stringify({expected_version:o.version,lines:ret})});note('Return recorded');await Promise.all([detail(o.id),fetchOrders(),loadInventory()])}catch(x){note(x.message,true);if(x.code==='stale_version')await detail(o.id)}finally{busy=false}}
async function loadAudit(){let root=$('#audit-view');root.innerHTML='<div class="card">Loading audit history…</div>';try{let x=await api('/audit?limit=100');root.innerHTML=`<div class="card"><h2>Audit history</h2>${x.items.length?`<div class="scroll"><table data-testid="audit-table"><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>Actor</th></tr></thead><tbody>${x.items.map(a=>`<tr><td>${esc(new Date(a.created_at).toLocaleString())}</td><td>${esc(a.action)}</td><td>${esc(a.entity_id)}</td><td>${esc(a.actor)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No audit events yet.</p>'}</div>`}catch(e){root.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
start();})();
</script></body></html>
