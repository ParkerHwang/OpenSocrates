name: OpenSocrates CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: opensocrates-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.2
  CGO_ENABLED: "0"

jobs:
  source:
    name: Go source and product contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Exact source provenance
        env:
          OPENSOCRATES_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-provenance --output build/evidence/source-provenance.json
      - name: Source preparation
        run: go mod download
      - name: Formatting
        run: go run ./src/opensocrates/cmd/opensocrates-dev format --check
      - name: Static analysis
        run: go vet ./src/opensocrates/...
      - name: Generated content equivalence
        run: go run ./src/opensocrates/cmd/opensocrates-dev check generated --report build/evidence/generated.json
      - name: Generate distributions for source inspection
        run: go run ./src/opensocrates/cmd/opensocrates-dev generate
      - name: Build supported target for archive inspection only
        run: go run ./src/opensocrates/cmd/opensocrates-dev build --target darwin-arm64 --output dist/runtime
      - name: Assemble archive for source inspection
        run: go run ./src/opensocrates/cmd/opensocrates-dev package --target darwin-arm64 --runtime-root dist/runtime --output dist/native/darwin-arm64
      - name: Inventory Go dependencies and package bytes
        run: go run ./src/opensocrates/cmd/opensocrates-dev sbom --package dist/native/darwin-arm64 --output build/evidence/sbom.json
      - name: Source, content, adjudication, documentation and governance
        run: go run ./src/opensocrates/cmd/opensocrates-dev check all --report build/evidence/source-contracts.json
      - name: Behavioral source tests
        run: go test ./src/opensocrates/...
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: warn

  macos:
    name: Native macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Exact native source provenance
        env:
          OPENSOCRATES_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-provenance --output build/evidence/package-source-provenance-darwin-arm64.json
      - name: Execute native platform, runtime, updater and recovery tests
        run: go test ./src/opensocrates/...
      - name: Build native binaries
        run: go run ./src/opensocrates/cmd/opensocrates-dev build --target darwin-arm64 --output dist/runtime
      - name: Assemble native bundle
        run: go run ./src/opensocrates/cmd/opensocrates-dev package --target darwin-arm64 --runtime-root dist/runtime --output dist/native/darwin-arm64
      - name: Validate native package
        run: go run ./src/opensocrates/cmd/opensocrates-dev check package --package dist/native/darwin-arm64/packages/codex --report build/evidence/native-package-darwin-arm64.json
      - name: Build isolated host registration fixture
        run: go build -o build/opensocrates-host-fixture ./src/opensocrates/cmd/opensocrates-host-fixture
      - name: Native install, status and removal acceptance
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance lifecycle --binary dist/runtime/darwin-arm64/opensocrates --package dist/native/darwin-arm64 --host-binary build/opensocrates-host-fixture --report build/evidence/native-lifecycle-darwin-arm64.json
      - name: Native hook startup timing
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance timing --binary dist/runtime/darwin-arm64/opensocrates --package dist/native/darwin-arm64/packages/codex --report build/evidence/codex-hook-timing-darwin-arm64.json
      - name: Isolated native OS scheduler acceptance
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance scheduler --host-binary build/opensocrates-host-fixture --report build/evidence/native-scheduler-darwin-arm64.json
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-darwin-arm64-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/
            build/evidence/
          if-no-files-found: warn

  windows:
    name: Native Windows x64 and ARM64
    uses: ./.github/workflows/windows.yml
