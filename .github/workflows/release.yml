name: OpenSocrates release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  release:
    name: Build and publish release
    needs: windows
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Release OpenSocrates v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv stopped publishing floating major tags after v7, so the
      # current maintained release is pinned exactly rather than by major.
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Resolve and validate release identity
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/tags/${tag}" ]]; then
            echo "Manual publication requires the exact version tag, not a branch." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          # A branch push publishes only when its subject line is exactly
          # "Release OpenSocrates v<VERSION>". The job-level prefix match alone
          # would let any commit whose message merely starts with that prefix
          # publish with contents:write under whatever VERSION happens to hold.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" != refs/tags/* ]]; then
            # Pure parameter expansion, not "printf | head -n 1": under
            # `set -o pipefail` a long commit body makes head exit first, so
            # printf takes SIGPIPE and the step dies with status 141 and no
            # diagnostic at all. Still fail-closed, but unactionable.
            subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
            if [[ "${subject}" != "Release OpenSocrates v${version}" ]]; then
              printf 'Refusing to publish: commit subject "%s" does not exactly match\n' \
                "${subject}" >&2
              echo "\"Release OpenSocrates v${version}\" from VERSION." >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Verify exact release target
        run: python tools/release_identity.py

      - name: Require GitHub release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          if [[ "${enabled}" != "true" ]]; then
            echo "GitHub immutable releases must be enabled before publishing a new release." >&2
            exit 1
          fi

      - name: Bootstrap locked environment
        run: make bootstrap
      - name: Activate locked native build toolchain
        run: uv sync --locked --no-install-project --group build
      - name: Stage standalone installer dependency for the Mac release profiles
        shell: bash
        run: |
          set -euo pipefail
          if python -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split("."))) < (1, 5, 0))' "${RELEASE_VERSION}"; then
            mkdir -p dist
            cp installer/managed-hosts.mjs dist/managed-hosts.mjs
            cmp installer/managed-hosts.mjs dist/managed-hosts.mjs
          fi
      - name: Run complete release gate
        run: make release-check

      - name: Create and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          for host in codex; do
            asset="opensocrates-${RELEASE_VERSION}-${host}-plugin.zip"
            (
              cd dist
              shasum -a 256 "${asset}" > "${asset}.sha256"
            )
          done
          node installer/opensocrates.mjs verify --host all \
            --asset-codex "dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip" \
            --checksum-codex "dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip.sha256"
          if python -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split("."))) < (1, 5, 0))' "${RELEASE_VERSION}"; then
            for profile in claude-plugin claude-chat-skills antigravity-plugin; do
              asset="opensocrates-${RELEASE_VERSION}-${profile}.zip"
              (
                cd dist
                shasum -a 256 -c "${asset}.sha256"
              )
            done
            for host in claude claude-chat antigravity; do
              kind=plugin
              if [[ "${host}" == claude-chat ]]; then kind=skills; fi
              asset="dist/opensocrates-${RELEASE_VERSION}-${host}-${kind}.zip"
              node installer/opensocrates.mjs verify --host "${host}" \
                --asset "${asset}" --checksum "${asset}.sha256"
            done
            cmp installer/managed-hosts.mjs dist/managed-hosts.mjs
          fi

      - uses: actions/download-artifact@v7
        with:
          name: windows-packages-${{ github.sha }}
          path: dist/
      - name: Verify Windows asset transport
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *-windows-x64.zip.sha256; do shasum -a 256 -c "$checksum"; done
          cp ../installer/windows.ps1 windows.ps1
          cd ..
          .venv/bin/python tools/merge_windows_release.py

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ github.run_id }}
          path: |
            dist/
            build/evidence/
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          codex_asset="dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip"
          manifest="dist/opensocrates-${RELEASE_VERSION}-release-manifest.json"
          limitations="dist/opensocrates-${RELEASE_VERSION}-limitations.json"
          sbom="dist/opensocrates-${RELEASE_VERSION}-sbom.spdx.json"
          release_assets=(
            "${codex_asset}"
            "${codex_asset}.sha256"
            "${manifest}"
            "${limitations}"
            "${sbom}"
            "dist/opensocrates-${RELEASE_VERSION}-checksums.sha256"
            "installer/opensocrates.mjs"
            "dist/windows.ps1"
            "dist/opensocrates-${RELEASE_VERSION}-codex-plugin-windows-x64.zip"
            "dist/opensocrates-${RELEASE_VERSION}-codex-plugin-windows-x64.zip.sha256"
          )
          if python -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split("."))) < (1, 5, 0))' "${RELEASE_VERSION}"; then
            release_assets+=("dist/managed-hosts.mjs")
            for profile in claude-plugin claude-chat-skills antigravity-plugin; do
              asset="dist/opensocrates-${RELEASE_VERSION}-${profile}.zip"
              release_assets+=("${asset}" "${asset}.sha256")
            done
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release collision: ${RELEASE_TAG} already exists; refusing overwrite." >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" "${release_assets[@]}" \
            --verify-tag \
            --title "OpenSocrates ${RELEASE_VERSION}" \
            --notes-file ".github/release-notes/v${RELEASE_VERSION}.md"

      - name: Verify exact published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python tools/verify_published_release.py --repo "${{ github.repository }}" --commit "${{ github.sha }}"
      - name: Upload postpublication verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-release-verification-${{ github.run_id }}
          path: build/evidence/public-release-verified.json
          if-no-files-found: warn
