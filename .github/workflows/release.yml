name: OpenSocrates native release

# Publication is an explicitly approved operation on an already reviewed tag.
# No branch push, pull request, npm hook or scheduled update can publish a release.
on:
  workflow_dispatch:
    inputs:
      targets_version:
        description: New monotonic TUF targets version
        required: true
        type: string
      snapshot_version:
        description: New monotonic TUF snapshot version
        required: true
        type: string
      timestamp_version:
        description: New monotonic TUF timestamp version
        required: true
        type: string
      initial_repository:
        description: Initial stable metadata repository only, with role versions 1
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: opensocrates-native-production-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.2
  CGO_ENABLED: "0"

jobs:
  native:
    name: Sign and qualify ${{ matrix.target }}
    environment: ${{ matrix.signing_environment }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: '["macos-15"]'
            signing_environment: opensocrates-release-signing-macos
          - target: windows-x64
            runner: '["self-hosted", "Windows", "X64", "opensocrates-release"]'
            signing_environment: opensocrates-release-signing
          - target: windows-arm64
            runner: '["self-hosted", "Windows", "ARM64", "opensocrates-release"]'
            signing_environment: opensocrates-release-signing-windows-arm64
    # Mac uses a fresh hosted ARM64 VM and an owned per-job keychain. Every
    # signing/publication environment requires the owner's explicit approval.
    # Windows signing runners retain their separate qualification requirements.
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      OPENSOCRATES_RELEASE_APPROVED: "true"
      OPENSOCRATES_MAC_SIGN_IDENTITY: ${{ vars.OPENSOCRATES_MAC_SIGN_IDENTITY }}
      OPENSOCRATES_MAC_TEAM_ID: ${{ vars.OPENSOCRATES_MAC_TEAM_ID }}
      OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE: ${{ vars.OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE }}
      OPENSOCRATES_WINDOWS_CERT_SHA1: ${{ vars.OPENSOCRATES_WINDOWS_CERT_SHA1 }}
      OPENSOCRATES_WINDOWS_TIMESTAMP_URL: ${{ vars.OPENSOCRATES_WINDOWS_TIMESTAMP_URL }}
      OPENSOCRATES_SIGNTOOL: ${{ vars.OPENSOCRATES_SIGNTOOL }}
    steps:
      - name: Preserve canonical checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Require exact merged remote tag
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-identity
      - name: Exact source provenance
        env:
          OPENSOCRATES_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-provenance --output build/evidence/package-source-provenance-${{ matrix.target }}.json
      - name: Execute native behavioral, protection and recovery tests
        run: go test ./src/opensocrates/...
      - name: Build native binaries
        run: go run ./src/opensocrates/cmd/opensocrates-dev build --target ${{ matrix.target }} --output dist/runtime
      - name: Compile reviewed Mac signing tools before credential access
        id: mac_tool
        if: matrix.target == 'darwin-arm64'
        run: go build -trimpath -o build/opensocrates-dev ./src/opensocrates/cmd/opensocrates-dev
      - name: Prepare temporary Mac signing keychain
        if: matrix.target == 'darwin-arm64'
        env:
          OPENSOCRATES_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OPENSOCRATES_RUNNER_ARCH: ${{ runner.arch }}
          OPENSOCRATES_MAC_SIGN_IDENTITY: ${{ vars.OPENSOCRATES_MAC_SIGN_IDENTITY }}
          OPENSOCRATES_MAC_TEAM_ID: ${{ vars.OPENSOCRATES_MAC_TEAM_ID }}
          OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE: ${{ vars.OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE }}
          OPENSOCRATES_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.OPENSOCRATES_MAC_CERTIFICATE_P12_BASE64 }}
          OPENSOCRATES_MAC_CERTIFICATE_PASSWORD: ${{ secrets.OPENSOCRATES_MAC_CERTIFICATE_PASSWORD }}
          OPENSOCRATES_NOTARY_APPLE_ID: ${{ secrets.OPENSOCRATES_NOTARY_APPLE_ID }}
          OPENSOCRATES_NOTARY_APP_PASSWORD: ${{ secrets.OPENSOCRATES_NOTARY_APP_PASSWORD }}
        run: build/opensocrates-dev macos-signing-prepare --purpose production
      - name: Sign and verify Mac binaries on hosted ARM64
        if: matrix.target == 'darwin-arm64'
        env:
          OPENSOCRATES_MAC_SIGN_IDENTITY: ${{ vars.OPENSOCRATES_MAC_SIGN_IDENTITY }}
          OPENSOCRATES_MAC_TEAM_ID: ${{ vars.OPENSOCRATES_MAC_TEAM_ID }}
          OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE: ${{ vars.OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE }}
        run: build/opensocrates-dev release-sign --target darwin-arm64
      - name: Sign and verify binaries on native OS
        if: matrix.target != 'darwin-arm64'
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-sign --target ${{ matrix.target }}
      - name: Assemble signed native archive and installer
        run: go run ./src/opensocrates/cmd/opensocrates-dev package --target ${{ matrix.target }} --runtime-root dist/runtime --output dist/native/${{ matrix.target }}
      - name: Generate distributions for source gates
        run: go run ./src/opensocrates/cmd/opensocrates-dev generate
      - name: Inventory dependencies and signed bundle bytes
        run: go run ./src/opensocrates/cmd/opensocrates-dev sbom --package dist/native/${{ matrix.target }} --output build/evidence/sbom.json
      - name: Verify source gates
        run: go run ./src/opensocrates/cmd/opensocrates-dev check all --report build/evidence/source-contracts-${{ matrix.target }}.json
      - name: Retain target-specific dependency provenance
        run: go run ./src/opensocrates/cmd/opensocrates-dev sbom --package dist/native/${{ matrix.target }} --output build/evidence/sbom-${{ matrix.target }}.json
      - name: Notarize final macOS archive
        if: matrix.target == 'darwin-arm64'
        env:
          OPENSOCRATES_MAC_SIGN_IDENTITY: ${{ vars.OPENSOCRATES_MAC_SIGN_IDENTITY }}
          OPENSOCRATES_MAC_TEAM_ID: ${{ vars.OPENSOCRATES_MAC_TEAM_ID }}
          OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE: ${{ vars.OPENSOCRATES_NOTARY_KEYCHAIN_PROFILE }}
        run: build/opensocrates-dev release-notarize
      - name: Verify signed native package
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-check --target ${{ matrix.target }} --package dist/native/${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: signed-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/opensocrates-v*
            dist/opensocrates-claude-chat-v*.zip
            dist/opensocrates-antigravity-v*.zip
            build/evidence/package-source-provenance-${{ matrix.target }}.json
            build/evidence/platform-signing-${{ matrix.target }}.json
            build/evidence/notarization-${{ matrix.target }}.json
            build/evidence/sbom-${{ matrix.target }}.json
          if-no-files-found: error
      - name: Remove temporary Mac credentials and restore keychain search list
        if: always() && matrix.target == 'darwin-arm64' && steps.mac_tool.outcome == 'success'
        run: build/opensocrates-dev macos-signing-cleanup --purpose production
      - name: Retain Mac keychain cleanup result
        if: always() && matrix.target == 'darwin-arm64' && steps.mac_tool.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-signing-cleanup-${{ github.sha }}-${{ github.run_id }}
          path: build/evidence/macos-keychain-cleanup.json
          if-no-files-found: warn

  publish:
    name: Publish exact immutable Release and signed update metadata
    needs: native
    environment: opensocrates-release-publication
    runs-on: [self-hosted, Linux, X64, opensocrates-metadata-signing]
    permissions:
      contents: write
    env:
      OPENSOCRATES_RELEASE_APPROVED: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Require exact merged remote tag
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-identity
      - name: Require immutable release settings with approved administration-read credential
        env:
          # A separate fine-grained/App token scoped to this repository with
          # Administration:read is required; contents:write cannot read this API.
          OPENSOCRATES_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.OPENSOCRATES_RELEASE_ADMIN_READ_TOKEN }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-immutability
      - uses: actions/download-artifact@v7
        with:
          pattern: signed-native-*-${{ github.sha }}
          merge-multiple: true
          path: .
      - name: Verify separate native identities and content equivalence
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-merge-windows
      - name: Fetch previous authenticated stable metadata
        env:
          INITIAL_REPOSITORY: ${{ inputs.initial_repository }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev metadata-fetch --output build/previous-metadata --initial-repository="$INITIAL_REPOSITORY"
      - name: Sign online metadata under pinned production root
        env:
          TARGETS_VERSION: ${{ inputs.targets_version }}
          SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}
          TIMESTAMP_VERSION: ${{ inputs.timestamp_version }}
          INITIAL_REPOSITORY: ${{ inputs.initial_repository }}
          TARGETS_KEY_1: ${{ vars.OPENSOCRATES_TARGETS_KEY_1 }}
          TARGETS_KEY_2: ${{ vars.OPENSOCRATES_TARGETS_KEY_2 }}
          SNAPSHOT_KEY: ${{ vars.OPENSOCRATES_SNAPSHOT_KEY }}
          TIMESTAMP_KEY: ${{ vars.OPENSOCRATES_TIMESTAMP_KEY }}
        # The pinned offline root remains reviewed source; private online keys
        # are files mounted only into this isolated signing runner.
        run: >-
          go run ./src/opensocrates/cmd/opensocrates-dev metadata-sign
          --root config/update/root.json
          --macos-archive dist/opensocrates-v1.6.0-darwin-arm64.zip
          --windows-archive dist/opensocrates-v1.6.0-windows-x64.zip
          --windows-arm64-archive dist/opensocrates-v1.6.0-windows-arm64.zip
          --version 1.6.0 --content-revision 5
          --targets-version "$TARGETS_VERSION"
          --snapshot-version "$SNAPSHOT_VERSION"
          --timestamp-version "$TIMESTAMP_VERSION"
          --targets-key "$TARGETS_KEY_1"
          --targets-key "$TARGETS_KEY_2"
          --snapshot-key "$SNAPSHOT_KEY"
          --timestamp-key "$TIMESTAMP_KEY"
          --previous-metadata build/previous-metadata
          --initial-repository="$INITIAL_REPOSITORY"
          --output dist --site-output _site/updates/stable/metadata
      - name: Final exact publication inventory
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-finalize
      - name: Publish immutable GitHub Release
        env:
          OPENSOCRATES_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.OPENSOCRATES_RELEASE_ADMIN_READ_TOKEN }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-publish
      - name: Download and verify every public asset byte
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-verify-public
      - name: Upload signed metadata site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/opensocrates-v*-publication-inventory.json
            build/evidence/
          if-no-files-found: warn

  metadata:
    name: Activate signed stable metadata after verified immutable publication
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy stable metadata
        id: deployment
        uses: actions/deploy-pages@v4
