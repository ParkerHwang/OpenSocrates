name: OpenSocrates release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: Build and publish release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Release OpenSocrates v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv stopped publishing floating major tags after v7, so the
      # current maintained release is pinned exactly rather than by major.
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Resolve and validate release identity
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          # A branch push publishes only when its subject line is exactly
          # "Release OpenSocrates v<VERSION>". The job-level prefix match alone
          # would let any commit whose message merely starts with that prefix
          # publish with contents:write under whatever VERSION happens to hold.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" != refs/tags/* ]]; then
            # Pure parameter expansion, not "printf | head -n 1": under
            # `set -o pipefail` a long commit body makes head exit first, so
            # printf takes SIGPIPE and the step dies with status 141 and no
            # diagnostic at all. Still fail-closed, but unactionable.
            subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
            if [[ "${subject}" != "Release OpenSocrates v${version}" ]]; then
              printf 'Refusing to publish: commit subject "%s" does not exactly match\n' \
                "${subject}" >&2
              echo "\"Release OpenSocrates v${version}\" from VERSION." >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Bootstrap locked environment
        run: make bootstrap
      - name: Activate locked native build toolchain
        run: uv sync --locked --no-install-project --group build
      - name: Run complete release gate
        run: make release-check

      - name: Create and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          for host in antigravity claude codex cursor grok; do
            asset="opensocrates-${RELEASE_VERSION}-${host}-plugin.zip"
            (
              cd dist
              shasum -a 256 "${asset}" > "${asset}.sha256"
            )
          done
          node installer/opensocrates.mjs verify --host all \
            --asset-antigravity "dist/opensocrates-${RELEASE_VERSION}-antigravity-plugin.zip" \
            --checksum-antigravity "dist/opensocrates-${RELEASE_VERSION}-antigravity-plugin.zip.sha256" \
            --asset-claude "dist/opensocrates-${RELEASE_VERSION}-claude-plugin.zip" \
            --checksum-claude "dist/opensocrates-${RELEASE_VERSION}-claude-plugin.zip.sha256" \
            --asset-codex "dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip" \
            --checksum-codex "dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip.sha256" \
            --asset-cursor "dist/opensocrates-${RELEASE_VERSION}-cursor-plugin.zip" \
            --checksum-cursor "dist/opensocrates-${RELEASE_VERSION}-cursor-plugin.zip.sha256" \
            --asset-grok "dist/opensocrates-${RELEASE_VERSION}-grok-plugin.zip" \
            --checksum-grok "dist/opensocrates-${RELEASE_VERSION}-grok-plugin.zip.sha256"
          chat_asset="opensocrates-${RELEASE_VERSION}-claude-chat-skills.zip"
          (
            cd dist
            shasum -a 256 "${chat_asset}" > "${chat_asset}.sha256"
          )

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ github.run_id }}
          path: |
            dist/
            build/evidence/
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          antigravity_asset="dist/opensocrates-${RELEASE_VERSION}-antigravity-plugin.zip"
          claude_asset="dist/opensocrates-${RELEASE_VERSION}-claude-plugin.zip"
          chat_asset="dist/opensocrates-${RELEASE_VERSION}-claude-chat-skills.zip"
          codex_asset="dist/opensocrates-${RELEASE_VERSION}-codex-plugin.zip"
          cursor_asset="dist/opensocrates-${RELEASE_VERSION}-cursor-plugin.zip"
          grok_asset="dist/opensocrates-${RELEASE_VERSION}-grok-plugin.zip"
          manifest="dist/opensocrates-${RELEASE_VERSION}-release-manifest.json"
          limitations="dist/opensocrates-${RELEASE_VERSION}-limitations.json"
          sbom="dist/opensocrates-${RELEASE_VERSION}-sbom.spdx.json"
          release_assets=(
            "${antigravity_asset}"
            "${antigravity_asset}.sha256"
            "${claude_asset}"
            "${claude_asset}.sha256"
            "${chat_asset}"
            "${chat_asset}.sha256"
            "${codex_asset}"
            "${codex_asset}.sha256"
            "${cursor_asset}"
            "${cursor_asset}.sha256"
            "${grok_asset}"
            "${grok_asset}.sha256"
            "${manifest}"
            "${limitations}"
            "${sbom}"
            "installer/opensocrates.mjs"
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${release_assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "OpenSocrates ${RELEASE_VERSION}" \
              --notes-file ".github/release-notes/v${RELEASE_VERSION}.md"
          else
            gh release create "${RELEASE_TAG}" "${release_assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "OpenSocrates ${RELEASE_VERSION}" \
              --notes-file ".github/release-notes/v${RELEASE_VERSION}.md"
          fi
