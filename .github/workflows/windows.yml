name: Native Windows x64
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    env:
      GOTOOLCHAIN: go1.27.2
      CGO_ENABLED: "0"
    steps:
      - name: Preserve canonical LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Exact native source provenance
        env:
          OPENSOCRATES_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-provenance --output build/evidence/package-source-provenance-windows-x64.json
      - name: Execute Windows ACL, reparse, locking, recovery and helper tests
        run: go test ./src/opensocrates/...
      - name: Build native Windows x64 binaries
        run: go run ./src/opensocrates/cmd/opensocrates-dev build --target windows-x64 --output dist/runtime
      - name: Assemble native bundle
        run: go run ./src/opensocrates/cmd/opensocrates-dev package --target windows-x64 --runtime-root dist/runtime --output dist/native/windows-x64
      - name: Verify native Windows package
        run: go run ./src/opensocrates/cmd/opensocrates-dev check package --package dist/native/windows-x64/packages/codex --report build/evidence/native-package-windows-x64.json
      - name: Build isolated host registration fixture
        run: go build -o build/opensocrates-host-fixture.exe ./src/opensocrates/cmd/opensocrates-host-fixture
      - name: Native install, status and removal acceptance
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance lifecycle --binary dist/runtime/windows-x64/opensocrates.exe --package dist/native/windows-x64 --host-binary build/opensocrates-host-fixture.exe --report build/evidence/native-lifecycle-windows-x64.json
      - name: Native hook startup timing
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance timing --binary dist/runtime/windows-x64/opensocrates.exe --package dist/native/windows-x64/packages/codex --report build/evidence/codex-hook-timing-windows-x64.json
      - name: Isolated native OS scheduler acceptance
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance scheduler --host-binary build/opensocrates-host-fixture.exe --report build/evidence/native-scheduler-windows-x64.json
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-x64-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/
            build/evidence/
          if-no-files-found: warn
