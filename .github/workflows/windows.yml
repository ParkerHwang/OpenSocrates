name: Native Windows x64 and ARM64
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          # Official standard native ARM64 runner; no x64 emulation or
          # cross-compilation result is substituted for ARM64 execution.
          - target: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOTOOLCHAIN: go1.27.2
      CGO_ENABLED: "0"
    steps:
      - name: Preserve canonical LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Exact native source provenance
        env:
          OPENSOCRATES_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: go run ./src/opensocrates/cmd/opensocrates-dev release-provenance --output build/evidence/package-source-provenance-${{ matrix.target }}.json
      - name: Execute Windows ACL, reparse, locking, recovery and helper tests
        run: go test ./src/opensocrates/...
      - name: Build native Windows binaries
        run: go run ./src/opensocrates/cmd/opensocrates-dev build --target ${{ matrix.target }} --output dist/runtime
      - name: Assemble native bundle
        run: go run ./src/opensocrates/cmd/opensocrates-dev package --target ${{ matrix.target }} --runtime-root dist/runtime --output dist/native/${{ matrix.target }}
      - name: Verify native Windows package
        run: go run ./src/opensocrates/cmd/opensocrates-dev check package --package dist/native/${{ matrix.target }}/packages/codex --report build/evidence/native-package-${{ matrix.target }}.json
      - name: Build isolated host registration fixture
        run: go build -o build/opensocrates-host-fixture.exe ./src/opensocrates/cmd/opensocrates-host-fixture
      - name: Native install, status and removal acceptance
        id: native_lifecycle
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance lifecycle --binary dist/runtime/${{ matrix.target }}/opensocrates.exe --package dist/native/${{ matrix.target }} --host-binary build/opensocrates-host-fixture.exe --report build/evidence/native-lifecycle-${{ matrix.target }}.json
      - name: Bounded initial-install diagnostic after acceptance failure
        if: failure() && steps.native_lifecycle.outcome == 'failure'
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance install-profile --binary dist/runtime/${{ matrix.target }}/opensocrates.exe --package dist/native/${{ matrix.target }} --host-binary build/opensocrates-host-fixture.exe --report build/evidence/install-profile-private/native-install-profile-${{ matrix.target }}.json
      - name: Native hook startup timing
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance timing --binary dist/runtime/${{ matrix.target }}/opensocrates.exe --package dist/native/${{ matrix.target }}/packages/codex --report build/evidence/codex-hook-timing-${{ matrix.target }}.json
      - name: Isolated native OS scheduler acceptance
        run: go run ./src/opensocrates/cmd/opensocrates-dev acceptance scheduler --host-binary build/opensocrates-host-fixture.exe --report build/evidence/native-scheduler-${{ matrix.target }}.json
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/
            build/evidence/
          if-no-files-found: warn
