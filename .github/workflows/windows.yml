name: Native Windows x64
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff check src tools
      - run: uv run --locked ruff format --check src tools
      - run: uv run --locked mypy src
      - run: uv run --locked python tools/check_windows.py
      - run: uv run --locked python tools/build_windows.py
      - run: uv run --locked python tools/check_windows.py --packages
      - run: npm run test:windows
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages-${{ github.sha }}
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: build/evidence/
