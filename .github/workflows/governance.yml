name: Repository governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
concurrency:
  group: opensocrates-governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true
      - name: Validate policy and pull request handoff
        run: go run ./src/opensocrates/cmd/opensocrates-dev check governance --report build/evidence/governance.json
