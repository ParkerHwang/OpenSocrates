name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, private prompts,
        transcripts, and sensitive workspace data before submitting.
  - type: input
    id: version
    attributes:
      label: OpenSocrates version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex Desktop
        - Codex CLI
        - Source build or release tooling
        - GitHub/npx installer
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, CPU architecture, Codex version, and installation method.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe and reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only non-sensitive logs or validation output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private prompts, transcripts, and sensitive paths.
          required: true
        - label: This is not a confidential security vulnerability.
          required: true
