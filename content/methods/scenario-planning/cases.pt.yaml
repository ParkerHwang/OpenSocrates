      "prompt": "Nossa cidade prepara estratégia habitacional de dez anos enquanto migração e tecnologia de construção podem seguir direções independentes. Defina duas incertezas, quatro futuros sem probabilidades, ações úteis em todos, contingentes e sinais.",
