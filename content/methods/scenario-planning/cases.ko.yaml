schema: opensocrates.method-cases/1.0.0
cases:
  - id: scenario-planning-positive-1
    kind: positive
    prompt: "우리 도시는 이주와 건설 기술이 서로 다른 방향으로 움직일 수 있는 상황에서 10년 주거 전략을 준비해야 합니다. 두 핵심 불확실성을 정하고 확률 없이 일관된 미래 네 가지를 만든 뒤 무후회 조치, 조건부 조치, 조기 신호를 제시해 주세요."
    expected_route: scenario-planning
    expected_behavior: route
    decisive_features:
      - deep_uncertainty
      - macro_environment
      - forecast
    rationale: "장기 기간과 외부 동인이 하나의 전망이 아니라 구조화된 분기를 요구합니다. 독립 축, 네 시나리오, 행동, 신호를 확률 없이 요구하므로 적합합니다."
  - id: scenario-planning-positive-2
    kind: positive
    prompt: "5년 공중보건 프로그램이 기관 신뢰와 병원체 이동성의 서로 다른 조합에 놓일 수 있습니다. 2×2 시나리오 행렬을 만들고 각 세계의 전개 경로, 현재 계획의 유효성, 재검토를 촉발할 관찰 신호를 설명해 주세요."
    expected_route: scenario-planning
    expected_behavior: route
    decisive_features:
      - deep_uncertainty
      - macro_environment
      - new_evidence
    rationale: "외부 미래의 일관된 묶음, 행렬, 현재 계획의 풍동 점검, 조기 신호를 요청합니다. 가능성 순위를 매기는 전망 요청이 아닙니다."
  - id: scenario-planning-positive-3
    kind: positive
    prompt: "10년 교육 플랫폼 투자에 어떻게 대비할지 결정하려 합니다. 규제와 학습자 행동은 영향이 크지만 예측하기 어렵습니다. 예측 가능한 전제는 공통으로 두고 독립 축을 고른 뒤, 강건한 준비와 미래 신호에 따라 발동할 행동을 나눠 주세요."
    expected_route: scenario-planning
    expected_behavior: route
    decisive_features:
      - deep_uncertainty
      - macro_environment
      - irreversible_choice
      - plan
    rationale: "장기간의 대비 결정이며 영향이 크고 외부적인 불확실성이 있습니다. 공통 전제와 조건부 행동의 구분을 요구하므로 확률 없는 시나리오 플래닝이 적합합니다."
  - id: scenario-planning-negative-1
    kind: negative
    prompt: "분기 매출 모델에 기준 공식이 하나 있습니다. 전환율과 가격 가정을 방어 가능한 범위에서 바꾸고 선택이 뒤집히는 임계값을 보여 준 뒤 어느 입력을 더 조사할지 순위를 매겨 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - sensitive_inputs
    rationale: "모델, 입력 범위, 전환 임계값을 요구하는 민감도 분석 사례입니다. 독립 축과 외부 미래를 만드는 요청이 아니므로 가까운 가족 혼동으로 라우팅하지 않습니다."
  - id: scenario-planning-negative-2
    kind: negative
    prompt: "정의가 분명한 완료 제품 출시 참조집단을 사용해 다음 출시의 예상 납기 범위를 추정하고 내부 날짜와 비교해 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - forecast
      - reference_cases
    rationale: "완료 참조 사례로 외부 관점의 납기 범위를 추정하는 요청은 reference-class-forecasting에 속합니다. 시나리오를 나눌 필요가 없습니다."
  - id: scenario-planning-mechanical-1
    kind: mechanical
    prompt: "날짜가 붙은 마일스톤 12개를 시간순으로 정렬해 목록으로 반환해 주세요. 미래 불확실성이나 대비 결정은 없습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - mechanical
    rationale: "결정적인 순서 정렬 작업입니다. 구조화할 외부 불확실성이나 전략 선택이 없으므로 이 방법은 개입하지 않습니다."
  - id: scenario-planning-explicit-1
    kind: explicit
    prompt: "10년 에너지 전환 전략의 주 방법으로 scenario-planning을 사용해 주세요. 확률은 넣지 말고 서로 독립적인 핵심 불확실성 두 개, 이름 붙인 미래 네 개, 무후회 조치와 조기 신호를 제시해 주세요."
    expected_route: scenario-planning
    expected_behavior: explicit_primary
    decisive_features:
      - explicit_method
      - deep_uncertainty
      - macro_environment
    rationale: "방법을 명시했고 확률 없는 시나리오의 필수 출력도 구체적으로 지정했습니다. 그래도 근거, 범위, 입력 누락 시 보류 규칙은 적용됩니다."
  - id: scenario-planning-insufficiency-1
    kind: insufficiency
    prompt: "미래 시나리오 네 개를 만들어 주세요. 어떤 결정을 돕는지, 기간과 시스템 경계가 무엇인지, 어떤 외부 불확실성이 중요한지 아직 말하지 않았습니다."
    expected_route: null
    expected_behavior: hold
    decisive_features:
      - decisive_input_missing
    rationale: "초점 질문, 기간, 경계, 결정이 없으면 네 이야기는 장식적이고 제한이 없습니다. 필요한 범위만 묻고 결과를 보류해야 합니다."
