    {
      "id": "pestel-analysis-insufficiency-1",
      "kind": "insufficiency",
      "prompt": "Devemos entrar no mercado? Não forneci país ou jurisdição, horizonte, escopo do produto, referência inicial ou fontes das condições externas atuais.",
