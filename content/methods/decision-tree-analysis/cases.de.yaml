schema: opensocrates.method-cases/1.0.0
cases:
  - id: decision-tree-analysis-positive-1
    kind: positive
    prompt: "Pilot jetzt oder warten? Gemessenes Pilotergebnis entscheidet Ausweiten, Ändern oder Stoppen. Historische Programmaufzeichnungen begrenzen Äste; Entscheider kann am Prüfpunkt handeln."
    expected_route: decision-tree-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - choose
      - sequential_choice
      - unknown_probability
    rationale: "Folge und bedingte Handlungen sind wesentlich; historische Daten liefern prüfbare Wahrscheinlichkeits- und Ergebnisherkunft."
  - id: decision-tree-analysis-positive-2
    kind: positive
    prompt: "Wähle bei gestufter Einführung sofortige Ausweitung oder zuerst Test. Ergebnisse haben dokumentierte Bereiche und ändern spätere Handlungen; zeige Rückabwicklungspunkt und jede Astquelle."
    expected_route: decision-tree-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - sequential_choice
      - multiple_options
      - sensitive_inputs
    rationale: "Sequentielle Wahl mit Zufallsergebnissen und sinnvoller Rückabwicklung. Herkunft/Bereiche statt unbelegter Präzision verlangt."
  - id: decision-tree-analysis-positive-3
    kind: positive
    prompt: "Lieferant jetzt wählen oder dokumentierte Prüfung vor Vertragsbindung? Befunde ändern Anbieter oder führen Stopp; Vertragsverantwortlicher nennt Ergebniswerte und Prüfdatum."
    expected_route: decision-tree-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - sequential_choice
      - irreversible_choice
      - information_purchase
    rationale: "Prüfung ändert Optionen vor irreversibler Bindung. Baum zeigt Bedingungen und Rückabwicklung ohne erfundene Wahrscheinlichkeiten."
  - id: decision-tree-analysis-negative-1
    kind: negative
    prompt: "Ordne drei Softwareprodukte nach Preis, Zugänglichkeit, Support und Zuverlässigkeit. Keine spätere Beobachtung oder Folgehandlung; Kriterienvergleich mit Interessengruppengewichten gewünscht."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - multiple_objectives
    rationale: "Wahrscheinliche Verwechslung mit trade-off-analysis: statischer Mehrkriterienvergleich statt Folgebaum."
  - id: decision-tree-analysis-negative-2
    kind: negative
    prompt: "Regel verlangt Genehmigung jedes berechtigten dokumentiert erfüllten Antrags. Darf das Team günstigere Alternative wählen? Bei Geltung bleibt kein Ermessen."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - judgment
      - explicit_rules
      - single_feasible_option
      - binding_rule_without_discretion
    rationale: "Bindende Regel entscheidet; kein echter Entscheidungsknoten. Baum darf Regel nicht umgehen."
  - id: decision-tree-analysis-mechanical-1
    kind: mechanical
    prompt: "Folge festem Wenn-dann-Diagramm mit geprüften Eingaben und liefere Endetikett. Keine Zufallsknoten, unsicheren Ausgänge oder Wahl."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - mechanical
    rationale: "Deterministische Verfahrensausführung, kein Urteil sequentieller Unsicherheit."
  - id: decision-tree-analysis-explicit-1
    kind: explicit
    prompt: "Nutze decision-tree-analysis für gestufte Einführung. Zeige Entscheidung/Zufall, nur dokumentierte Astbereiche und Rückabwicklungspunkt."
    expected_route: decision-tree-analysis
    expected_behavior: explicit_primary
    decisive_features:
      - explicit_method
      - sequential_choice
      - multiple_options
    rationale: "Nutzer fordert Verfahren und Ausgaben ausdrücklich. Unbelegte Astwerte bleiben ungeprüft statt Ergänzung."
  - id: decision-tree-analysis-insufficiency-1
    kind: insufficiency
    prompt: "Jetzt starten oder warten? Folgehandlungen unklar, keine Ergebnisbegrenzungsquelle und kein rückabwicklungserlaubendes Signal genannt."
    expected_route: null
    expected_behavior: hold
    decisive_features:
      - judgment
      - sequential_choice
      - unknown_probability
      - decisive_input_missing
    rationale: "Folge, Astgrundlage und Rückabwicklungsbedingung fehlen entscheidungsrelevant. Aussetzen statt Wahrscheinlichkeit oder Strategie erfinden."
