    {
      "id": "double-loop-learning-positive-1",
      "kind": "positive",
      "prompt": "支持团队通过新检查表缩短了回应时间，但客户升级投诉在2个月后再次出现。比较预期与实际结果，审查塑造检查表的服务目标和规则，并为修订规则设计安全的学习试验。",
      "expected_route": "double-loop-learning",
      "expected_behavior": "route",
      "decisive_features": [
        "recurring_failure",
        "governing_rule",
        "repeat_iteration",
        "testable_claim"
      ],
      "rationale": "程序修正未能阻止重现，因此任务要求判断是否应改变指导目标或规则。路由应区分检查表行动与规则层面假设，并按出处标注升级投诉记录。"
    },
    {
