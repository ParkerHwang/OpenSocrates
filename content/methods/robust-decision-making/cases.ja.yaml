      "kind": "positive",
      "prompt": "数十年使うインフラの洪水防御設計を選ぶ必要があります。雨量、土地利用、資金の条件は深く不確実です。一つの予測で勝つ案ではなく、もっともらしい複数の世界で公開された安全下限を超える案が必要です。",
