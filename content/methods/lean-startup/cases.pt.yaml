      "decisive_features": [
        "safety_critical_validation",
        "irreversible_choice"
      ],
      "rationale": "Mudar doses reais é exposição insegura contraindicada, não experimento mínimo aceitável. Recuse ou encaminhe à governança clínica e de segurança qualificada."
    },
    {
