    {
      "id": "lean-startup-positive-1",
      "kind": "positive",
      "prompt": "Acreditamos que usuários novos concluirão a integração inicial se houver uma lista guiada. Desenhe um teste pequeno e reversível de protótipo, escolha uma métrica acionável de conclusão e declare previamente a regra de pivotar ou perseverar. As notas existentes de uso foram fornecidas pelo usuário e não verificadas.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "human_need",
        "plan",
        "testable_claim"
      ],
      "rationale": "É uma hipótese falsificável de produto com protótipo delimitado, métrica e regra solicitadas. As notas devem continuar fornecidas pelo usuário e não verificadas, sem virar demanda fabricada."
    },
    {
      "id": "lean-startup-positive-2",
      "kind": "positive",
      "prompt": "Antes de construir um plano pago completo, teste se um grupo definido de equipes pequenas solicitará um complemento de relatórios semanais. Especifique oferta mínima segura, janela, métrica, limiar e o que levaria a pivotar ou parar.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "prioritized_assumptions",
        "chosen_plan",
        "testable_claim"
      ],
      "rationale": "O pedido reduz uma hipótese de valor por oferta mínima e decisão acionável. Não assume demanda; limiar e referência devem ser rotulados como provenientes de fonte, calculados ou assumidos."
    },
    {
      "id": "lean-startup-positive-3",
      "kind": "positive",
      "prompt": "Nossa hipótese de retenção é que um lembrete após a primeira tarefa bem-sucedida trará usuários para uma segunda tarefa. Proponha teste limitado, salvaguarda, métrica ligada à hipótese e próxima decisão baseada no resultado observado.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "repeat_iteration",
        "human_need",
        "testable_claim"
      ],
      "rationale": "Hipótese, teste seguro, métrica e próxima decisão são explícitos. Um contexto testado não deve ser generalizado a todos os usuários sem mais evidências."
    },
    {
      "id": "lean-startup-negative-1",
      "kind": "negative",
