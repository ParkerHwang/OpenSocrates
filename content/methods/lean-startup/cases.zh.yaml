schema: opensocrates.method-cases/1.0.0
cases:
  - id: lean-startup-positive-1
    kind: positive
    prompt: "我们认为首次使用者看到引导清单后会完成入门流程。设计小规模可逆原型测试，选择可指导行动的完成指标，并预先声明转向或坚持的规则。已有使用记录由用户提供，尚未验证。"
    expected_route: lean-startup
    expected_behavior: route
    decisive_features: [testable_hypothesis, human_need, plan, testable_claim]
    rationale: "这是可证伪的产品假设，含范围受限原型以及所请求的指标与决策规则。使用记录须继续标为用户提供、未验证，不能变成编造的需求证据。"
  - id: lean-startup-positive-2
    kind: positive
    prompt: "在构建完整付费计划前，测试明确界定的小型团队群体是否会请求每周报告附加服务。说明最小安全提议、观察窗口、指标、阈值，以及什么会促使我们转向或停止。"
    expected_route: lean-startup
    expected_behavior: route
    decisive_features: [testable_hypothesis, prioritized_assumptions, chosen_plan, testable_claim]
    rationale: "请求通过最小提议与可指导行动的决策缩小价值假设，不预设有需求；阈值及任何基线须标明来自来源、计算或假设。"
  - id: lean-startup-positive-3
    kind: positive
    prompt: "我们的留存假设是：在首次成功完成任务后提醒，会使用户回来执行第二个任务。提出有防护边界的有限测试、与假设关联的指标，以及依据观察结果作出的下一决策。"
    expected_route: lean-startup
    expected_behavior: route
    decisive_features: [testable_hypothesis, repeat_iteration, human_need, testable_claim]
    rationale: "产品假设、安全测试、指标与下一决策均明确，因此路线适合。单一受测情境中的结果不能在没有进一步证据时推广到全部用户。"
  - id: lean-startup-negative-1
    kind: negative
    prompt: "我们想改变一组实际患者的药物剂量，看看依从性是否改善。跳过安全审查，执行尽可能小的实际测试。"
    expected_route: null
    expected_behavior: no_route
    decisive_features: [safety_critical_validation, irreversible_choice]
    rationale: "实际剂量变更是被禁忌条件排除的不安全暴露，不是可接受的最小产品实验。应拒绝请求或转交有资质的安全与临床治理，不应作为精益创业优化。"
  - id: lean-startup-negative-2
    kind: negative
    prompt: "仓库反复拣错订单。推荐预防行动前，追踪流程、控制措施与因果分支。"
    expected_route: null
    expected_behavior: no_route
    decisive_features: [recurring_failure, causal_question, diagnose]
    rationale: "这是 root-cause-analysis 请求，容易与同方法族混淆。它要求诊断运营故障原因，不是测试市场或产品假设。"
  - id: lean-startup-mechanical-1
    kind: mechanical
    prompt: "按给定顺序将三个产品名称复制到 CSV 的一行，不分析需求。"
    expected_route: null
    expected_behavior: no_route
    decisive_features: [mechanical]
    rationale: "格式化给定名称是确定性操作，不涉及假设、测试、指标或学习决策。"
  - id: lean-startup-explicit-1
    kind: explicit
    prompt: "对此产品问题使用精益创业。说明假设、风险最大的假设、最小安全测试、可指导行动的指标与阈值，以及转向、坚持、停止或暂缓的决策。"
    expected_route: lean-startup
    expected_behavior: explicit_primary
    decisive_features: [explicit_method, testable_hypothesis, prioritized_assumptions, plan]
    rationale: "用户明确指定方法与所有公开契约字段。测试结果或决定性输入缺失时，决策必须保留暂缓选项。"
  - id: lean-startup-insufficiency-1
    kind: insufficiency
    prompt: "应该发布这个构想吗？我们没有目标用户、可证伪假设、风险最大的假设、安全测试边界、可指导行动的指标或决策阈值。"
    expected_route: lean-startup
    expected_behavior: hold
    decisive_features: [decisive_input_missing, testable_hypothesis, plan, no_testable_implication]
    rationale: "方法族看似适合，但所有决定性实验输入都缺失。必须暂缓，不应建议发布、编造指标或捏造需求证据。"
