      "kind": "insufficiency",
      "prompt": "Devons-nous lancer cette idée ? Nous n’avons ni utilisateur cible, ni hypothèse réfutable, ni présupposé le plus risqué, ni limite de test sûre, ni indicateur exploitable, ni seuil de décision.",
