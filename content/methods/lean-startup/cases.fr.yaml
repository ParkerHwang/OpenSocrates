      "prompt": "Utilisez Lean Startup pour cette question produit. Énoncez l’hypothèse, son présupposé le plus risqué, le test minimal sûr, l’indicateur exploitable et le seuil, ainsi que la décision de pivoter, persévérer, arrêter ou suspendre.",
      "expected_route": "lean-startup",
