{
  "schema": "opensocrates.method-cases/1.0.0",
  "cases": [
    {
      "id": "lean-startup-positive-1",
      "kind": "positive",
      "prompt": "Nous pensons que les nouveaux utilisateurs termineront l’accueil si une liste guidée est affichée. Concevez un petit test de prototype réversible, choisissez un indicateur exploitable d’achèvement et annoncez la règle pour pivoter ou persévérer. Les notes d’usage existantes sont fournies par l’utilisateur et non vérifiées.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "human_need",
        "plan",
        "testable_claim"
      ],
      "rationale": "C’est une hypothèse produit réfutable avec un prototype délimité, un indicateur et une règle de décision demandés. Les notes doivent rester fournies par l’utilisateur et non vérifiées, sans devenir des preuves inventées de demande."
    },
    {
      "id": "lean-startup-positive-2",
      "kind": "positive",
      "prompt": "Avant de construire une offre payante complète, testez si un groupe défini de petites équipes demandera un module de rapports hebdomadaires. Précisez l’offre minimale sûre, la fenêtre d’observation, l’indicateur, le seuil et ce qui nous ferait pivoter ou arrêter.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "prioritized_assumptions",
        "chosen_plan",
        "testable_claim"
      ],
      "rationale": "La demande réduit l’incertitude sur une hypothèse de valeur par une offre minimale et une décision exploitable. Elle ne suppose pas la demande ; le seuil et toute référence doivent être étiquetés comme sourcés, calculés ou supposés."
    },
    {
      "id": "lean-startup-positive-3",
      "kind": "positive",
      "prompt": "Notre hypothèse de fidélisation est qu’un rappel après la première tâche réussie ramènera les utilisateurs vers une seconde tâche. Proposez un test limité avec un garde-fou, un indicateur lié à l’hypothèse et une prochaine décision fondée sur le résultat observé.",
      "expected_route": "lean-startup",
      "expected_behavior": "route",
      "decisive_features": [
        "testable_hypothesis",
        "repeat_iteration",
        "human_need",
        "testable_claim"
      ],
      "rationale": "L’orientation convient car l’hypothèse produit, le test sûr, l’indicateur et la prochaine décision sont explicites. Le résultat d’un contexte testé ne doit pas être généralisé à tous les utilisateurs sans preuves supplémentaires."
    },
    {
