    },
    {
      "id": "reference-class-forecasting-positive-3",
      "kind": "positive",
      "prompt": "一家非营利机构正在预测项目第一年参与人数。几个既往启动项目记录了参与结果、目标人群和启动条件，但覆盖不均。建立外部视角范围，显示覆盖限制，并与我们的计划比较。",
