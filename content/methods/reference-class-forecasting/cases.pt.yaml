      "id": "reference-class-forecasting-positive-1",
      "kind": "positive",
      "prompt": "Estimamos a entrega de um projeto ferroviário regional. Temos registros ligados a fontes de muitos projetos concluídos com escopo, aquisição e terreno comparáveis. Compare cronograma interno e distribuição observada e explique ajustes sem inventar probabilidade.",
