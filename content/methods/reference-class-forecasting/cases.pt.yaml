      "decisive_features": [
        "forecast",
        "reference_cases",
        "hidden_assumptions"
      ],
      "rationale": "É calibração por casos concluídos, não diagnóstico ou cenário preferido. Exige ajustes com proveniência e condição de mudança, não taxa base inventada."
    },
    {
      "id": "reference-class-forecasting-positive-3",
      "kind": "positive",
      "prompt": "Uma organização sem fins lucrativos prevê inscrições do primeiro ano. Lançamentos anteriores documentam resultados, públicos e condições, mas cobertura é desigual. Construa intervalo externo, mostre limitação e compare com plano.",
      "expected_route": "reference-class-forecasting",
      "expected_behavior": "route",
      "decisive_features": [
        "forecast",
        "reference_cases",
        "weak_sample"
      ],
      "rationale": "Há alvo e casos concluídos; preserve cobertura desigual. Use distribuição observada e suspenda ou reduza conclusão se ausências forem decisivas."
    },
    {
      "id": "reference-class-forecasting-negative-1",
      "kind": "negative",
      "prompt": "Não temos casos concluídos comparáveis deste instrumento científico único. Explique que escolha de engenharia causou atraso e proponha experimento corretivo.",
