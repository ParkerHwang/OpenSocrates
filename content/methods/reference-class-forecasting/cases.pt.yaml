      "expected_behavior": "route",
      "decisive_features": [
        "forecast",
        "reference_cases",
        "source_quality"
      ],
      "rationale": "Alvo e unidade são declarados, há classe defensável e solicita-se intervalo externo. Registros sustentam resultados observados, não probabilidades fabricadas."
    },
    {
      "id": "reference-class-forecasting-positive-2",
      "kind": "positive",
      "prompt": "Nossa equipe estima com otimismo tempo e custo de migrar clientes para plataforma nova. Temos migrações comparáveis concluídas e resultados reais de outras equipes. Teste credibilidade da visão interna e declare evidência que mudaria o intervalo.",
