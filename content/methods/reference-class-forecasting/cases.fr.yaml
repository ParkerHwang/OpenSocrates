      "kind": "explicit",
      "prompt": "Utilisez la prévision par classe de référence comme méthode principale pour notre date de lancement logiciel. Nous avons des résultats sourcés de lancements comparables ; comparez la distribution au plan interne et suspendez si la classe n’est pas défendable.",
      "expected_route": "reference-class-forecasting",
