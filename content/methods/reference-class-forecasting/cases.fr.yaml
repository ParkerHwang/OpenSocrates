    {
      "id": "reference-class-forecasting-positive-1",
      "kind": "positive",
      "prompt": "Nous estimons la date de livraison d’un projet ferroviaire régional. Nous avons des dossiers sourcés de nombreux projets achevés comparables en périmètre, achats et terrain. Comparez le calendrier interne à la distribution observée d’achèvement et expliquez les ajustements sans inventer de probabilité.",
      "expected_route": "reference-class-forecasting",
      "expected_behavior": "route",
      "decisive_features": [
        "forecast",
        "reference_cases",
        "source_quality"
      ],
      "rationale": "Cible et unité prévisionnelles sont énoncées, une classe défendable est disponible et un intervalle externe est demandé. Les dossiers soutiennent les résultats observés, pas des probabilités fabriquées."
    },
    {
      "id": "reference-class-forecasting-positive-2",
      "kind": "positive",
      "prompt": "Notre équipe produit estime avec optimisme le délai et le coût de migration des clients vers une plateforme. Nous connaissons des migrations comparables achevées par d’autres équipes et leurs résultats réels. Testez la crédibilité de notre vision interne et précisez les preuves qui changeraient l’intervalle.",
      "expected_route": "reference-class-forecasting",
      "expected_behavior": "route",
      "decisive_features": [
        "forecast",
        "reference_cases",
        "hidden_assumptions"
      ],
      "rationale": "La tâche calibre sur des cas achevés comparables, pas sur un diagnostic causal ou scénario favori. Elle exige des ajustements attentifs à la provenance et une condition de basculement plutôt qu’un taux de base inventé."
    },
    {
      "id": "reference-class-forecasting-positive-3",
      "kind": "positive",
      "prompt": "Une association prévoit les inscriptions d’un programme la première année. Plusieurs lancements passés documentent inscriptions, populations cibles et conditions, mais la couverture est inégale. Construisez un intervalle externe, montrez cette limite et comparez-le à notre plan.",
      "expected_route": "reference-class-forecasting",
      "expected_behavior": "route",
      "decisive_features": [
        "forecast",
        "reference_cases",
        "weak_sample"
      ],
      "rationale": "Une cible et des cas achevés existent ; la couverture inégale est une incertitude explicite à préserver. Il faut utiliser la distribution observée et suspendre ou affaiblir la conclusion si les manques sont décisifs."
    },
    {
      "id": "reference-class-forecasting-negative-1",
      "kind": "negative",
      "prompt": "Nous n’avons aucun cas achevé comparable pour cet instrument scientifique unique. Expliquez quel choix d’ingénierie a causé le retard et proposez une expérience corrective.",
