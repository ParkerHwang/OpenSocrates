      "expected_behavior": "no_route",
      "decisive_features": [
        "no_defensible_reference_class",
        "diagnose"
      ],
      "rationale": "La consigne manque explicitement de classe défendable et demande une explication causale. Cette orientation répéterait la vision interne sans distribution externe."
    },
    {
      "id": "reference-class-forecasting-negative-2",
      "kind": "negative",
      "prompt": "Construisez quatre futurs externes distincts pour notre stratégie à cinq ans, nommez-les et identifiez signaux précoces et actions. N’estimez pas une cible de délai ou de coût à partir de cas passés.",
