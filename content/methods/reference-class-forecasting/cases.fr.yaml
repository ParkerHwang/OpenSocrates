      "decisive_features": [
        "deep_uncertainty",
        "macro_environment",
        "plan"
      ],
      "rationale": "Confusion probable avec scenario-planning : la tâche demande des futurs divergents et indicateurs, pas une distribution de référence prévisionnelle."
    },
    {
      "id": "reference-class-forecasting-mechanical-1",
      "kind": "mechanical",
      "prompt": "Additionnez ces cinq montants de factures vérifiés et renvoyez le total dans la devise indiquée. Aucune prévision, classe comparative ou décision n’est nécessaire.",
