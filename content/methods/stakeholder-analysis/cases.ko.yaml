schema: "opensocrates.method-cases/1.0.0"
cases:
  - id: "stakeholder-analysis-positive-1"
    kind: positive
    prompt: "현장 직원, 관리자, 고객, 노동자 대표에게 영향을 주는 일정 변경을 도입합니다. 각자의 이해, 결정권, 예상 우려, 동의 필요, 참여 책임자를 지도화해 주세요."
    expected_route: "stakeholder-analysis"
    expected_behavior: route
    decisive_features:
      - "interacting_actors"
      - "stakeholder_conflict"
    rationale: "연락처 목록이 아니라 실행과 연결된 행위자 지도가 필요합니다. 우려와 효과는 기록이나 대화로 뒷받침되기 전까지 가설이므로 불확실성을 드러내야 합니다."
  - id: "stakeholder-analysis-positive-2"
    kind: positive
    prompt: "공공 정책이 공식 의사결정 집단에 들어오지 않은 주민에게도 영향을 줍니다. 결정권자, 영향을 받지만 대표되지 않는 집단, 권력과 영향, 갈등 지점, 책임 있는 참여 계획을 찾아 주세요."
    expected_route: "stakeholder-analysis"
    expected_behavior: route
    decisive_features:
      - "interacting_actors"
      - "stakeholder_conflict"
    rationale: "대표성과 실행이 결정에 중요하다고 명시한 요청입니다. 공식 권한과 영향력을 구분하고 근거 없이 피해나 동의를 추정하지 않아야 합니다."
  - id: "stakeholder-analysis-positive-3"
    kind: positive
    prompt: "여러 조직이 공동 데이터 표준을 도입해야 합니다. 승인하거나 막거나 혜택을 받거나 비용을 부담하는 주체를 분석한 뒤 참여 책임자와 출시 계획을 바꿀 반응을 정해 주세요."
    expected_route: "stakeholder-analysis"
    expected_behavior: route
    decisive_features:
      - "interacting_actors"
      - "stakeholder_conflict"
    rationale: "도입이 분산된 권한과 실행 지원에 달려 있습니다. 조직 역할이 합의를 증명한다고 보지 말고 이해와 영향의 증거 상태를 공개해야 합니다."
  - id: "stakeholder-analysis-negative-1"
    kind: negative
    prompt: "모든 의사결정 참여자가 목표에 동의하고 영향을 받는 집단도 중요하지 않습니다. 비용, 신뢰성, 납기 기준으로 실행 가능한 두 공급자를 비교해 주세요."
    expected_route: "trade-off-analysis"
    expected_behavior: route
    decisive_features:
      - "multiple_options"
      - "multiple_objectives"
    rationale: "사람에 관한 문제는 정리되었고 남은 판단은 트레이드오프 비교입니다. 이해관계자 지도를 추가해도 선택을 해결하지 못하는 장식이 됩니다."
  - id: "stakeholder-analysis-negative-2"
    kind: negative
    prompt: "우리 제품 전략에 영향을 줄 정치, 경제, 사회, 기술, 환경, 법적 변화를 훑어 주세요."
    expected_route: "pestel-analysis"
    expected_behavior: route
    decisive_features:
      - "macro_environment"
      - "forecast"
    rationale: "전략과 관련되지만 필요한 산출물은 외부 요인 기록입니다. 이해관계자 지도가 아니라 PESTEL 분석으로 넘겨야 하는 가까운 가족 혼동 사례입니다."
  - id: "stakeholder-analysis-mechanical-1"
    kind: mechanical
    prompt: "이 연락처 목록에서 중복 이름을 제거하고 남은 이름을 알파벳순으로 정렬해 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - "mechanical"
      - "mechanical"
    rationale: "제공된 텍스트를 변환하는 일뿐이므로 이해, 권력, 동의, 실행을 평가할 필요가 없습니다."
  - id: "stakeholder-analysis-explicit-1"
    kind: explicit
    prompt: "이 병원 업무 흐름 변경에 이해관계자 분석을 사용해 주세요. 결정권, 영향받는 집단, 권력과 영향의 근거, 갈등, 참여 책임자, 전환 조건을 보여 주세요."
    expected_route: "stakeholder-analysis"
    expected_behavior: explicit_primary
    decisive_features:
      - "explicit_method"
      - "stakeholder_conflict"
    rationale: "사용자가 방법과 공개 필드를 직접 지정했으므로 우선 방법으로 유지합니다. 추론된 우려와 미검증 효과는 확정 사실처럼 말하지 않아야 합니다."
  - id: "stakeholder-analysis-insufficiency-1"
    kind: insufficiency
    prompt: "새 출근 정책을 진행해야 할까요? 결정권자, 영향을 받는 집단, 권한 경로, 판단 기간, 정책 효과에 관한 근거를 아직 정하지 않았습니다."
    expected_route: "stakeholder-analysis"
    expected_behavior: hold
    decisive_features:
      - "decisive_input_missing"
      - "interacting_actors"
    rationale: "실행 지원이 결정적일 수 있지만 행위자 경계와 권한이 빠져 있습니다. 동의나 반대를 선언하지 말고 최소 사실을 확인할 때까지 보류해야 합니다."
