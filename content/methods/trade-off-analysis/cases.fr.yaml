    {
      "id": "trade-off-analysis-positive-1",
      "kind": "positive",
      "prompt": "Choisissez entre trois fournisseurs selon rapidité, fiabilité, accessibilité et coût total. Le groupe d’achats a documenté le veto et chaque partie a fourni une préférence datée pour les autres critères.",
      "expected_route": "trade-off-analysis",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "choose",
        "multiple_options",
        "multiple_objectives",
        "stakeholder_conflict"
      ],
      "rationale": "Plusieurs options rivalisent selon des critères explicites, avec contrainte séparée et provenance des poids. La comparaison montre les concessions sans prétendre que toutes les valeurs sont interchangeables."
    },
    {
      "id": "trade-off-analysis-positive-2",
      "kind": "positive",
      "prompt": "Une équipe produit choisit une conception équilibrant performance, maintenabilité, confidentialité et effort utilisateur. Les tests soutiennent certaines notes, les entretiens d’autres ; la confidentialité est une condition minimale, pas un score.",
