      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "choose",
        "multiple_options",
        "multiple_objectives",
        "source_quality"
      ],
      "rationale": "Il faut une comparaison attentive à la provenance et une contrainte de confidentialité non compensable. Les preuves mixtes peuvent être étiquetées plutôt qu’aplaties."
    },
    {
      "id": "trade-off-analysis-positive-3",
      "kind": "positive",
      "prompt": "Deux plans d’effectifs diffèrent en couverture, continuité, coûts et charge. L’équipe a convenu d’un ordre ordinal, pas d’une échelle numérique précise ; montrez le gagnant sous cet ordre et ce qui l’inverserait.",
      "expected_route": "trade-off-analysis",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "choose",
        "multiple_options",
        "multiple_objectives",
        "sensitive_inputs"
      ],
      "rationale": "Un compromis ordinal et une condition de basculement sont explicitement demandés. La méthode évite la fausse précision tout en rendant le choix visible."
    },
    {
      "id": "trade-off-analysis-negative-1",
      "kind": "negative",
      "prompt": "Un code du bâtiment impose un standard incendie. Une seule conception conforme reste ; le demandeur veut préférer une conception moins chère non conforme mieux notée en commodité.",
