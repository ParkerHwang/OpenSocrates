        "binding_rule_without_discretion"
      ],
      "rationale": "Une exigence contraignante est traitée comme compensable. La famille probable est deontic-reasoning ou examen de conformité qualifié, pas analyse des compromis."
    },
    {
      "id": "trade-off-analysis-negative-2",
      "kind": "negative",
      "prompt": "Nous hésitons à conduire une étude client avant de choisir une conception. La question est de savoir combien l’étude changerait la décision et si son délai en vaut la peine, pas comment comparer les conceptions aujourd’hui.",
