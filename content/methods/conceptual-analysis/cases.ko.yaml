schema: opensocrates.method-cases/1.0.0
cases:
  - id: conceptual-analysis-positive-01
    kind: positive
    prompt: "엔지니어링 팀과 컴플라이언스 팀이 다르게 쓰는 ‘안전한 출시’를 우리 팀에서는 무엇으로 정의해야 하나요?"
    expected_route: conceptual-analysis
    expected_behavior: route
    decisive_features: [ambiguous_terms, argument_dispute]
    rationale: "출시 기준으로 행동하기 전에 경쟁 의미와 경계 사례를 시험해야 합니다."
  - id: conceptual-analysis-positive-02
    kind: positive
    prompt: "공정성을 동일 대우로 볼지 동일 기회로 볼지 의견이 갈릴 때 이 정책은 공정한가요?"
    expected_route: conceptual-analysis
    expected_behavior: route
    decisive_features: [ambiguous_terms, argument_dispute]
    rationale: "사례에 미치는 결과가 서로 다른 운영 의미에 달려 있습니다."
  - id: conceptual-analysis-positive-03
    kind: positive
    prompt: "제품 팀과 지원 팀이 경계 사례를 일관되게 분류하도록 ‘출시 준비 완료’를 정의해 주세요."
    expected_route: conceptual-analysis
    expected_behavior: route
    decisive_features: [ambiguous_terms]
    rationale: "쓸 수 있는 정의에는 필요·충분 조건과 경계 사례 시험이 필요합니다."
  - id: conceptual-analysis-negative-01
    kind: negative
    prompt: "공개된 API 명세를 사용해 이 요청이 문서의 필수 필드를 충족하는지 확인해 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [explicit_rules]
    rationale: "운영 정의가 권위 있게 정해져 있어 남은 일은 직접 규칙 적용입니다."
  - id: conceptual-analysis-negative-02
    kind: negative
    prompt: "세 연구를 설계 품질 순으로 정렬하고 어떤 연구가 효과 주장을 직접 지지하는지 설명해 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [source_quality, reconcile_evidence]
    rationale: "병목은 논쟁 용어가 아니라 증거의 품질과 적용 가능성입니다."
  - id: conceptual-analysis-mechanical-01
    kind: mechanical
    prompt: "이 파일의 ‘출시 준비됨’을 모두 ‘출시 준비 완료’로 바꿔 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [mechanical]
    rationale: "문자열 치환은 개념 분석이 필요 없는 기계 작업입니다."
  - id: conceptual-analysis-explicit-01
    kind: explicit
    prompt: "conceptual-analysis를 명시적으로 사용해 고객 보고서에서 ‘신뢰할 수 있음’의 의미를 정의해 주세요."
    expected_route: conceptual-analysis
    expected_behavior: explicit_primary
    decisive_features: [explicit_method, ambiguous_terms]
    rationale: "보고 결과가 달린 모호한 용어에 사용자가 방법을 명시적으로 호출했습니다."
  - id: conceptual-analysis-insufficiency-01
    kind: insufficiency
    prompt: "논쟁 중인 개념이 충족되는지 판단해 주세요. 맥락, 사례, 통제할 결정은 주지 않겠습니다."
    expected_route: null
    expected_behavior: hold
    decisive_features: [ambiguous_terms, decisive_input_missing]
    rationale: "맥락과 사례 없이는 운영 의미가 임의적이므로 안전한 결정을 통제할 수 없습니다."
