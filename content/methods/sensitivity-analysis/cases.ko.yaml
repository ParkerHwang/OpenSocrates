schema: opensocrates.method-cases/1.0.0
cases:
  - id: sensitivity-analysis-positive-1
    kind: positive
    prompt: "사업성 분석에서 수요, 인건비, 에너지 가정으로 창고 설계 두 안을 비교합니다. 기준 공식과 결정 임계값은 문서화되어 있지만 입력에는 방어 가능한 범위가 있습니다. 범위를 시험하고 전환값을 보여 주며 선택이 강건한지 취약한지 밝혀 주세요."
    expected_route: sensitivity-analysis
    expected_behavior: route
    decisive_features:
      - sensitive_inputs
      - multiple_objectives
      - choose
    rationale: "모델, 비교, 문서화된 기준선, 입력 범위, 선택 임계값이 있습니다. 입력을 흔들어 결정 전환을 드러내는 요청이므로 확률을 만들지 않는 민감도 분석이 적합합니다."
  - id: sensitivity-analysis-positive-2
    kind: positive
    prompt: "서비스 센터의 응답 시간 목표를 포함한 인력 모델이 있습니다. 출처가 있는 범위에서 도착량, 처리 시간, 인력 가정의 영향을 시험하고 의존성을 보존하면서 인력 결정을 바꿀 수 있는 조사의 우선순위를 정해 주세요."
    expected_route: sensitivity-analysis
    expected_behavior: route
    decisive_features:
      - sensitive_inputs
      - unknown_probability
      - choose
      - information_purchase
    rationale: "모델, 목표 임계값, 불확실한 입력, 정보 우선순위 요구가 모두 있습니다. 의존성을 보존한 계산 또는 서열 변화를 보고할 수 있고 확률을 꾸밀 필요가 없습니다."
  - id: sensitivity-analysis-positive-3
    kind: positive
    prompt: "투자위원회가 비용, 영향, 실행 위험으로 세 프로젝트를 점수화합니다. 가중치는 문서화되어 있지만 논쟁 중이고 권고가 뒤집힐 수 있습니다. 정당화된 범위에서 가중치와 입력 점수를 바꾸고 전환값과 취약한 가정을 기록해 주세요."
    expected_route: sensitivity-analysis
    expected_behavior: route
    decisive_features:
      - sensitive_inputs
      - multiple_objectives
      - choose
    rationale: "가중치와 점수가 불확실한 구조화된 비교이며 권고 전환 가능성이 명시되었습니다. 확정된 가중치로 상충을 결론내기 전에 민감도를 드러내는 요청입니다."
  - id: sensitivity-analysis-negative-1
    kind: negative
    prompt: "모델이나 결정 임계값은 없습니다. 서로 충돌하는 연구를 검토해 어느 출처가 신뢰할 만한지 판단하고 안전 주장에 대한 근거를 조정해 주세요."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - conflicting_sources
      - source_quality
      - decisive_input_missing
    rationale: "증거 계층 또는 증거 조정이 필요한 가까운 가족 혼동 사례입니다. 흔들 모델·규칙·임계값이 없으므로 민감도 분석을 수행할 수 없습니다."
  - id: sensitivity-analysis-negative-2
    kind: negative
    prompt: "우리 조직의 10년 외부 미래 네 가지를 구성하고 각 미래에 대비할 준비를 설명해 주세요. 수치 모델, 선택 점수, 흔들 변수 관계는 없습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - deep_uncertainty
      - macro_environment
      - decisive_input_missing
    rationale: "깊은 불확실성에서 시나리오를 구성하는 요청이며 모델과 변수 관계가 없다고 명시했습니다. 기준선을 만들어내며 민감도 분석으로 처리하면 안 됩니다."
  - id: sensitivity-analysis-mechanical-1
    kind: mechanical
    prompt: "검증된 각 수량에 지정된 단위 변환 계수를 곱해 변환 목록을 반환해 주세요. 모델, 비교, 결정 임계값은 없습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - mechanical
    rationale: "결정적인 단위 변환입니다. 불확실한 입력 범위나 취약성을 분석할 결정 결과가 없습니다."
  - id: sensitivity-analysis-explicit-1
    kind: explicit
    prompt: "가격 결정의 주 방법으로 sensitivity-analysis를 사용해 주세요. 기준 공헌이익 모델, 논쟁 중인 판매량·마진 범위, 최소 허용 마진은 문서화되어 있습니다. 전환값을 찾고 범위의 출처가 없으면 보류해 주세요."
    expected_route: sensitivity-analysis
    expected_behavior: explicit_primary
    decisive_features:
      - explicit_method
      - sensitive_inputs
      - choose
    rationale: "방법을 명시했고 기준선, 불확실한 범위, 임계값, 출처 보류 규칙을 제공합니다. 출력은 계산값 또는 표시된 상태로 남겨야 하며 확률화하지 않습니다."
  - id: sensitivity-analysis-insufficiency-1
    kind: insufficiency
    prompt: "이 권고가 민감한지 말해 주세요. 권고를 만든 기준 모델, 입력, 범위, 결정 임계값, 공식은 아직 제공하지 않았습니다."
    expected_route: null
    expected_behavior: hold
    decisive_features:
      - decisive_input_missing
    rationale: "기준선, 흔들 입력, 범위, 임계값이 모두 결정적인데 빠졌습니다. 일반적인 민감도 주장을 만들지 말고 제한된 입력 요청과 함께 보류해야 합니다."
