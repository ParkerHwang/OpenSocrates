      ],
      "rationale": "所需预测扩展了重复案例，须说明范围和反例风险。"
    },
    {
      "id": "induction-negative-01",
      "kind": "negative",
      "prompt": "严格规则规定每条符合条件的记录均获批准；判断本案例是否遵循规则。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "explicit_rules",
        "explain"
      ],
      "rationale": "任务是演绎式规则应用，不是基于样本的一般化。"
    },
    {
      "id": "induction-negative-02",
      "kind": "negative",
      "prompt": "多种解释符合故障；比较它们并识别能加以区分的观察。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "competing_explanations",
        "diagnose"
      ],
      "rationale": "这是溯因诊断，而非从样本扩展到总体。"
    },
    {
      "id": "induction-mechanical-01",
      "kind": "mechanical",
      "prompt": "将这些新观察追加到现有数据集，不改变任何数值。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "mechanical"
      ],
      "rationale": "追加已提供的数据是机械操作。"
    },
    {
      "id": "induction-explicit-01",
      "kind": "explicit",
