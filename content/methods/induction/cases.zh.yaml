    {
      "id": "induction-insufficiency-01",
      "kind": "insufficiency",
      "prompt": "从样本推广，但不提供目标总体、抽样过程、观察或测量定义。",
      "expected_route": null,
      "expected_behavior": "hold",
      "decisive_features": [
        "repeated_observations",
