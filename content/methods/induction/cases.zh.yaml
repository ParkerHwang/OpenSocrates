        "repeated_observations",
        "weak_sample"
      ],
      "rationale": "任务从观察案例推向限定的总体主张，需要样本与反例检查。"
    },
    {
      "id": "induction-positive-02",
      "kind": "positive",
      "prompt": "评估这项调查样本是否足以支持客户偏好新工作流程的主张。",
      "expected_route": "induction",
      "expected_behavior": "route",
      "decisive_features": [
        "repeated_observations",
        "weak_sample"
      ],
      "rationale": "代表性、选择偏倚和一般化强度是核心。"
    },
    {
      "id": "induction-positive-03",
      "kind": "positive",
      "prompt": "根据这些过去事件，考虑合理反例，我们能对下季度作出什么合理推断？",
