{
  "schema": "opensocrates.method-cases/1.0.0",
  "cases": [
    {
      "id": "jobs-to-be-done-positive-01",
      "kind": "positive",
      "prompt": "小企业在紧张的报税截止期后聘请会计；探明其中的期望进展、情感安心、社会信号和备选方案。",
      "expected_route": "jobs-to-be-done",
      "expected_behavior": "route",
      "decisive_features": [
        "user_progress",
        "human_need"
      ],
      "rationale": "具体的受困时刻和多维任务，比功能或人口统计更能解释聘用。"
    },
    {
      "id": "jobs-to-be-done-positive-02",
      "kind": "positive",
      "prompt": "用户继续使用缓慢的电子表格而不采用新工具；梳理推动力、吸引力、习惯、焦虑和期望进展。",
      "expected_route": "jobs-to-be-done",
      "expected_behavior": "route",
      "decisive_features": [
        "user_progress",
        "human_need"
      ],
      "rationale": "问题聚焦转换力量、非消费以及个人试图取得的进展。"
    },
    {
      "id": "jobs-to-be-done-positive-03",
      "kind": "positive",
      "prompt": "交通服务想了解乘客在深夜出行时选用它来完成什么，以及应如何观察成功。",
      "expected_route": "jobs-to-be-done",
      "expected_behavior": "route",
      "decisive_features": [
        "user_progress",
        "human_need"
      ],
      "rationale": "需要特定情境下的功能性、情感性和社会性进展及成功指标。"
    },
    {
      "id": "jobs-to-be-done-negative-01",
      "kind": "negative",
      "prompt": "在作出产品承诺前，应把观察到的用户挫折变成3个原型概念及安全试验。",
      "expected_route": "design-thinking",
      "expected_behavior": "route",
      "decisive_features": [
        "human_need",
        "user_progress"
      ],
      "rationale": "主要需求是观察引导的概念生成与原型制作，而非仅分析任务力量。"
    },
    {
      "id": "jobs-to-be-done-negative-02",
      "kind": "negative",
      "prompt": "产品团队需要在可逆试点中，按可测量后果比较2种引导流程方案。",
      "expected_route": "pragmatism",
      "expected_behavior": "route",
      "decisive_features": [
        "practical_consequence",
        "choose"
      ],
      "rationale": "决策瓶颈是实际方案比较，不是发现潜在任务。"
    },
    {
      "id": "jobs-to-be-done-mechanical-01",
      "kind": "mechanical",
      "prompt": "将客户访谈记录放入独立文件，不推断任何任务或动机。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [],
      "rationale": "即使输入是用户访谈，文件整理也是机械操作。"
    },
    {
      "id": "jobs-to-be-done-explicit-01",
      "kind": "explicit",
      "prompt": "使用 jobs-to-be-done，解释通勤者在晚班期间为何从公交车转向滑板车。",
      "expected_route": "jobs-to-be-done",
      "expected_behavior": "explicit_primary",
      "decisive_features": [
        "explicit_method",
        "user_progress"
      ],
      "rationale": "用户明确要求情境与转换力量分析。"
    },
    {
      "id": "jobs-to-be-done-insufficiency-01",
      "kind": "insufficiency",
      "prompt": "只有功能清单；宣称所有客户的普遍任务，并设定全市场成功率。",
      "expected_route": null,
      "expected_behavior": "hold",
      "decisive_features": [
        "user_progress",
        "decisive_input_missing"
      ],
      "rationale": "功能清单无法确立特定情境的任务或全市场比率。"
    }
  ]
}
