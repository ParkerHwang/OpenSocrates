schema: opensocrates.method-cases/1.0.0
cases:
  - id: logic-tree-positive-01
    kind: positive
    prompt: "¿Por qué aumentó la pérdida de clientes y cómo podemos descomponer las causas en ramas comprobables sin solapamientos?"
    expected_route: logic-tree
    expected_behavior: route
    decisive_features: [tangled_hierarchy, diagnose, plan]
    rationale: "El diagnóstico amplio necesita un árbol de porqués con eje explícito, comprobaciones MECE y pruebas en las hojas."
  - id: logic-tree-positive-02
    kind: positive
    prompt: "Construye un árbol completo de problemas para reducir fallos de incorporación, con una comprobación en cada hoja."
    expected_route: logic-tree
    expected_behavior: route
    decisive_features: [tangled_hierarchy, plan]
    rationale: "Se solicitan cobertura y descomposición accionable."
  - id: logic-tree-positive-03
    kind: positive
    prompt: "Divide esta pregunta amplia sobre riesgos en ramas sin solapamientos que el equipo operativo pueda asignar y comprobar."
    expected_route: logic-tree
    expected_behavior: route
    decisive_features: [tangled_hierarchy, diagnose]
    rationale: "Requiere ramas jerárquicas, comprobaciones de cobertura y hojas ejecutables."
  - id: logic-tree-negative-01
    kind: negative
    prompt: "Comprueba si las categorías existentes se solapan y si falta algún caso."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [category_overlap, tangled_hierarchy]
    rationale: "La auditoría acotada de clasificación corresponde a MECE, no a construir recursivamente un árbol."
  - id: logic-tree-negative-02
    kind: negative
    prompt: "Dibuja los bucles de retroalimentación entre estas variables e identifica dinámicas reforzadoras y equilibradoras."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [feedback_delay, causal_question]
    rationale: "Los bucles interdependientes encajan mal en una jerarquía y requieren un método de sistemas."
  - id: logic-tree-mechanical-01
    kind: mechanical
    prompt: "Aplica sangría a estos encabezados para reproducir la estructura de árbol del ejemplo."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [mechanical]
    rationale: "Aplicar la sangría indicada es una tarea mecánica de formato."
  - id: logic-tree-explicit-01
    kind: explicit
    prompt: "Usa explícitamente logic-tree para estructurar las causas del retraso de nuestro lanzamiento."
    expected_route: logic-tree
    expected_behavior: explicit_primary
    decisive_features: [explicit_method, tangled_hierarchy]
    rationale: "El usuario selecciona explícitamente una estructura jerárquica de diagnóstico."
  - id: logic-tree-insufficiency-01
    kind: insufficiency
    prompt: "Crea el árbol completo de problemas, pero no indiques pregunta raíz, alcance ni medida de éxito."
    expected_route: null
    expected_behavior: hold
    decisive_features: [tangled_hierarchy, decisive_input_missing]
    rationale: "Sin raíz acotada no pueden juzgarse con seguridad la cobertura ni la capacidad de actuar en las hojas."
