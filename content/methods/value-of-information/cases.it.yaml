      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "information_purchase",
        "new_evidence",
        "sensitive_inputs"
      ],
      "rationale": "L’informazione ha un percorso dichiarato capace di cambiare l’azione e un onere di raccolta circoscritto. Il caso non richiede probabilità di successo o valori monetari inventati."
    },
    {
      "id": "value-of-information-positive-2",
      "kind": "positive",
      "prompt": "Prima di firmare un contratto di fornitura, possiamo ispezionare una variabile di rischio di guasto che potrebbe cambiare il fornitore scelto. Fonte, costo, ritardo e soglia decisionale sono documentati; decidi se l’ispezione vale la pena.",
      "expected_route": "value-of-information",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "information_purchase",
        "irreversible_choice",
        "sensitive_inputs"
      ],
      "rationale": "L’informazione arriva prima di una decisione irreversibile e conduce a un’azione diversa. Provenienza e ritardo possono essere mostrati senza inventare probabilità a posteriori."
    },
    {
      "id": "value-of-information-positive-3",
      "kind": "positive",
      "prompt": "Un gruppo di politica pubblica deve decidere se ampliare un programma o sospenderlo per una valutazione mirata. La valutazione distingue un risultato che porterebbe all’ampliamento da uno che fermerebbe il programma; esposizione e scadenza sono dichiarate.",
      "expected_route": "value-of-information",
