    {
      "id": "value-of-information-positive-1",
      "kind": "positive",
      "prompt": "Possiamo lanciare subito o svolgere prima uno studio sugli utenti. Un risultato sull’adozione attiverebbe azioni di lancio diverse, metodo e costo diretto dello studio sono noti e il gruppo ha una data fissa oltre la quale il ritardo non è accettabile.",
