    {
      "id": "value-of-information-positive-1",
      "kind": "positive",
      "prompt": "Nous pouvons lancer maintenant ou mener d’abord une étude utilisateur. Un résultat d’adoption déclencherait différentes actions de lancement, méthode et coût direct sont connus et une date fixe marque le délai désormais inacceptable.",
      "expected_route": "value-of-information",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "information_purchase",
        "new_evidence",
        "sensitive_inputs"
      ],
      "rationale": "L’information a une voie déclarée de changement d’action et une charge de collecte délimitée. Aucune probabilité de succès ni valeur monétaire inventée n’est nécessaire."
    },
    {
      "id": "value-of-information-positive-2",
      "kind": "positive",
      "prompt": "Avant de signer un contrat fournisseur, nous pouvons inspecter une variable de risque susceptible de changer le fournisseur choisi. Source, coût, délai et seuil sont documentés ; décidez si l’inspection en vaut la peine.",
      "expected_route": "value-of-information",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "information_purchase",
        "irreversible_choice",
        "sensitive_inputs"
      ],
      "rationale": "L’information arrive avant une décision irréversible et mène à une action différente. Provenance et délai se montrent sans fabriquer une probabilité a posteriori."
    },
    {
      "id": "value-of-information-positive-3",
      "kind": "positive",
      "prompt": "Une équipe politique doit choisir entre étendre un programme ou suspendre pour une évaluation ciblée. Celle-ci distingue un résultat menant à l’extension d’un résultat menant à l’arrêt ; exposition et échéance sont déclarées.",
      "expected_route": "value-of-information",
      "expected_behavior": "route",
      "decisive_features": [
        "judgment",
        "information_purchase",
        "testable_hypothesis",
        "feedback_delay"
      ],
      "rationale": "La question porte sur un test faisable changeant l’action avant une échéance, pas une recherche supplémentaire ouverte."
    },
    {
