schema: opensocrates.method-cases/1.0.0
cases:
  - id: value-of-information-positive-1
    kind: positive
    prompt: "지금 출시하거나 먼저 이용자 조사를 할 수 있습니다. 이용률에 관한 결과에 따라 출시 행동이 달라지고 조사 방법과 직접 비용은 알려져 있으며, 지연을 더 허용할 수 없는 고정 날짜가 있습니다."
    expected_route: value-of-information
    expected_behavior: route
    decisive_features:
      - judgment
      - information_purchase
      - new_evidence
      - sensitive_inputs
    rationale: "정보가 행동을 바꾸는 경로와 수집 부담의 범위가 정해져 있습니다. 성공 확률이나 화폐 가치를 꾸밀 필요가 없습니다."
  - id: value-of-information-positive-2
    kind: positive
    prompt: "공급업체 계약을 서명하기 전에 고장 위험 변수를 검사할 수 있고 그 결과에 따라 업체 선택이 달라질 수 있습니다. 검사 출처, 비용, 지연, 결정 임계값이 문서화되어 있으니 검사가 가치 있는지 판단해 주세요."
    expected_route: value-of-information
    expected_behavior: route
    decisive_features:
      - judgment
      - information_purchase
      - irreversible_choice
      - sensitive_inputs
    rationale: "정보가 되돌리기 어려운 결정 전에 들어오고 다른 행동으로 연결됩니다. 사후 확률을 꾸미지 않고 출처와 지연을 보일 수 있습니다."
  - id: value-of-information-positive-3
    kind: positive
    prompt: "정책팀이 사업을 확대할지 특정 평가를 위해 잠시 멈출지 정해야 합니다. 평가가 확대할 결과와 중단할 결과를 구분할 수 있고, 노출과 평가 기한도 정해져 있습니다."
    expected_route: value-of-information
    expected_behavior: route
    decisive_features:
      - judgment
      - information_purchase
      - testable_hypothesis
      - feedback_delay
    rationale: "현실적인 검사가 정해진 기한 전에 행동을 바꿀 수 있는지가 질문입니다. 열린 추가 조사 요청이 아닙니다."
  - id: value-of-information-negative-1
    kind: negative
    prompt: "재택근무에 관해 흥미로운 내용을 모두 찾아 문헌 요약을 해 주세요. 결정, 행동 임계값, 불확실한 변수, 기한은 정해지지 않았습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - explain
      - source_quality
    rationale: "행동을 바꾸는 결정이 없는 열린 조사입니다. 결정과 임계값을 먼저 정하지 않으면 정보 가치를 평가할 수 없습니다."
  - id: value-of-information-negative-2
    kind: negative
    prompt: "안전 규정이 승인된 보호 장비를 사용하도록 요구합니다. 더 싼 미승인 장비를 쓰도록 추가 조사가 정당화할 수 있는지 결정해 주세요. 규정은 재량을 주지 않습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - judgment
      - explicit_rules
      - binding_rule_without_discretion
      - single_feasible_option
    rationale: "가족 혼동 가능성이 큰 deontic-reasoning 또는 자격 있는 안전 검토 사례입니다. 새 정보로 구속력 있는 규정을 거래할 수 없습니다."
  - id: value-of-information-mechanical-1
    kind: mechanical
    prompt: "제공된 표본 크기 식과 검증된 입력으로 필요한 표본 크기만 계산해 주세요. 조사를 할지 또는 결정 가치가 있는지는 판단하지 않습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - mechanical
    rationale: "고정 계산이며 정보가 행동을 바꿀 수 있는지에 대한 판단이 아닙니다."
  - id: value-of-information-explicit-1
    kind: explicit
    prompt: "이 검사에 value-of-information을 사용해 비용과 지연을 감수할 가치가 있는지 판단해 주세요. 어떤 결과가 공급업체 결정을 바꾸는지와 검사를 어디서 끝낼지도 적어 주세요."
    expected_route: value-of-information
    expected_behavior: explicit_primary
    decisive_features:
      - explicit_method
      - information_purchase
      - irreversible_choice
    rationale: "사용자가 방법을 명시적으로 호출하고 임계값·행동 변경·비용·지연·중단 계약을 요청했습니다."
  - id: value-of-information-insufficiency-1
    kind: insufficiency
    prompt: "행동하기 전에 더 조사해야 할까요? 현재 행동, 대안 행동, 불확실한 변수, 가능한 검사, 감수할 수 있는 지연이 정해지지 않았습니다."
    expected_route: null
    expected_behavior: hold
    decisive_features:
      - judgment
      - information_purchase
      - decisive_input_missing
    rationale: "행동 임계값과 실행 가능한 정보 경로가 없어 행동 변경 가치를 정할 수 없습니다. 가장 작은 안전 확인을 요청하고 보류해야 합니다."
