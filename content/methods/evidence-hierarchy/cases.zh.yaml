        "reconcile_evidence",
        "conflicting_sources",
        "source_quality"
      ],
      "rationale": "主要任务是检查证据流的独立性和趋同，属于三角互证。"
    },
    {
      "id": "evidence-hierarchy-negative-02",
      "kind": "negative",
      "prompt": "根据哪种结果最符合我们声明的价值观，在这些方案之间选择。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "value_conflict",
        "choose"
      ],
      "rationale": "不能只因存在来源，就把价值偏好变成证据层级问题。"
    },
    {
      "id": "evidence-hierarchy-mechanical-01",
      "kind": "mechanical",
