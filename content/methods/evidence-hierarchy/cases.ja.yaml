      "expected_behavior": "no_route",
      "decisive_features": [
        "value_conflict",
        "choose"
      ],
      "rationale": "情報源があるだけで価値上の好みが証拠階層の問題になるわけではありません。"
    },
    {
      "id": "evidence-hierarchy-mechanical-01",
      "kind": "mechanical",
      "prompt": "提供した引用を出版日順に並べ、題名を維持してください。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "mechanical"
      ],
      "rationale": "引用の並べ替えは機械的で、質や適用可能性を評価しません。"
