schema: opensocrates.method-cases/1.0.0
cases:
  - id: bayesian-updating-positive-01
    kind: positive
    prompt: "Como este teste positivo deve mudar as chances dos diagnósticos concorrentes, considerando suas diferentes taxas de base?"
    expected_route: bayesian-updating
    expected_behavior: route
    decisive_features: [new_evidence, unknown_probability, competing_explanations]
    rationale: "A tarefa exige uma base a priori, direção da evidência, mudança a posteriori e sensibilidade às taxas de base."
  - id: bayesian-updating-positive-02
    kind: positive
    prompt: "Atualize nossa confiança nas duas hipóteses de lançamento conforme estes sinais chegam sequencialmente."
    expected_route: bayesian-updating
    expected_behavior: route
    decisive_features: [new_evidence, unknown_probability, competing_explanations]
    rationale: "Evidências sequenciais devem atualizar hipóteses concorrentes sem contar sinais duas vezes."
  - id: bayesian-updating-positive-03
    kind: positive
    prompt: "Mostre se a recomendação se inverte quando a taxa a priori e os pressupostos de verossimilhança variam em intervalos confiáveis."
    expected_route: bayesian-updating
    expected_behavior: route
    decisive_features: [new_evidence, unknown_probability]
    rationale: "O julgamento solicitado trata da sensibilidade da probabilidade a posteriori e do limiar de ação."
  - id: bayesian-updating-negative-01
    kind: negative
    prompt: "Classifique estas fontes pela relação direta e pela qualidade do estudo antes de decidir com que força a alegação pode ser declarada."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [source_quality, reconcile_evidence]
    rationale: "A tarefa calibra a qualidade das fontes, em vez de atualizar um conjunto definido de hipóteses."
  - id: bayesian-updating-negative-02
    kind: negative
    prompt: "Liste explicações concorrentes para esta anomalia e proponha um teste que as distingue."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [competing_explanations, diagnose]
    rationale: "Gerar explicações e testes discriminantes pertence à abdução quando não se pede uma atualização a priori."
  - id: bayesian-updating-mechanical-01
    kind: mechanical
    prompt: "Copie os valores a priori fornecidos para a planilha de análise."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [mechanical]
    rationale: "Copiar valores é mecânico e não deve acionar raciocínio probabilístico."
  - id: bayesian-updating-explicit-01
    kind: explicit
    prompt: "Use bayesian-updating explicitamente para revisar a confiança após este novo sinal de fraude."
    expected_route: bayesian-updating
    expected_behavior: explicit_primary
    decisive_features: [explicit_method, new_evidence]
    rationale: "O usuário seleciona explicitamente uma atualização de confiança baseada em evidências."
  - id: bayesian-updating-insufficiency-01
    kind: insufficiency
    prompt: "Forneça a probabilidade a posteriori, mas sem hipóteses concorrentes, base a priori ou informações de verossimilhança."
    expected_route: null
    expected_behavior: hold
    decisive_features: [new_evidence, unknown_probability, decisive_input_missing]
    rationale: "Uma probabilidade a posteriori numérica sem hipóteses e proveniência das entradas seria precisão inventada."
