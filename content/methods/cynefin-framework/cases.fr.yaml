    {
      "id": "cynefin-framework-insufficiency-1",
      "kind": "insufficiency",
      "prompt": "Devons-nous standardiser ce problème ou expérimenter ? Je n'ai décrit ni problème, ni causes, ni urgence, ni éléments disponibles.",
      "expected_route": "cynefin-framework",
      "expected_behavior": "hold",
      "decisive_features": [
