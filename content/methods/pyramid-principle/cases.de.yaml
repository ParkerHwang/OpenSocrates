schema: opensocrates.method-cases/1.0.0
cases:
  - id: pyramid-principle-positive-01
    kind: positive
    prompt: "Machen Sie aus dieser validierten Analyse eine Führungsvorlage mit Empfehlung zuerst, dann gruppierten Gründen und Details."
    expected_route: pyramid-principle
    expected_behavior: route
    decisive_features: [explain, tangled_hierarchy]
    rationale: "Grundurteil steht; Engpass ist Schluss-zuerst-Kommunikation."
  - id: pyramid-principle-positive-02
    kind: positive
    prompt: "Ordnen Sie den Bericht so, dass der Kerngedanke oben steht und jeder Abschnitt ihn überschneidungsfrei stützt."
    expected_route: pyramid-principle
    expected_behavior: route
    decisive_features: [explain, tangled_hierarchy]
    rationale: "Gefordert sind Antwort, Begründungsgruppen, vertikale Zusammenfassung und horizontale Reihenfolge."
  - id: pyramid-principle-positive-03
    kind: positive
    prompt: "Machen Sie diese lange Entscheidungsanalyse für Führungskräfte überblickbar, ohne Unsicherheit oder Alternativen zu verbergen."
    expected_route: pyramid-principle
    expected_behavior: route
    decisive_features: [explain, tangled_hierarchy]
    rationale: "Bereits beurteilte Analyse strukturieren und wesentliche Unsicherheit erhalten."
  - id: pyramid-principle-negative-01
    kind: negative
    prompt: "Welche Prämisse stützt die Empfehlung, und was ist der stärkste offene Einwand?"
    expected_route: null
    expected_behavior: no_route
    decisive_features: [argument_dispute, critique]
    rationale: "Argumentunterstützung prüfen statt geklärte Antwort neu ordnen."
  - id: pyramid-principle-negative-02
    kind: negative
    prompt: "Entscheiden Sie, ob diese Empfehlung gestützt ist; Evidenz und Alternativen wurden noch nicht geprüft."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [source_quality, critique]
    rationale: "Kommunikationsstruktur ersetzt kein ungeklärtes Grundurteil."
  - id: pyramid-principle-mechanical-01
    kind: mechanical
    prompt: "Wenden Sie interne Überschriftenstile an und bewahren Sie die Satzreihenfolge."
    expected_route: null
    expected_behavior: no_route
    decisive_features: [mechanical]
    rationale: "Feste Formatierung ist mechanisch."
  - id: pyramid-principle-explicit-01
    kind: explicit
    prompt: "Nutzen Sie ausdrücklich pyramid-principle, um dieses Vorstandsupdate mit Schluss zuerst umzuschreiben."
    expected_route: pyramid-principle
    expected_behavior: explicit_primary
    decisive_features: [explicit_method, explain]
    rationale: "Methode ist ausdrücklich für führungsgerechte Kommunikation verlangt."
  - id: pyramid-principle-insufficiency-01
    kind: insufficiency
    prompt: "Stellen Sie den Schluss voran, aber liefern Sie weder Leitfrage noch Schluss, Evidenz oder Publikumsentscheidung."
    expected_route: null
    expected_behavior: hold
    decisive_features: [explain, decisive_input_missing]
    rationale: "Ohne stabiles Urteil und Publikumsentscheidung wäre die Antwort erfunden."
