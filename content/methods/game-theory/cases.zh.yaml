    },
    {
      "id": "game-theory-insufficiency-1",
      "kind": "insufficiency",
      "prompt": "是否应以价格回应威胁竞争者？我尚未明确竞争者可行行动、我方后果、双方信息或关系是否重复。",
      "expected_route": "game-theory",
      "expected_behavior": "hold",
      "decisive_features": [
        "decisive_input_missing",
