{
  "schema": "opensocrates.method-cases/1.0.0",
  "cases": [
    {
      "id": "game-theory-positive-1",
      "kind": "positive",
      "prompt": "如果我们降低订阅价格，主要竞争者可跟进降价或保持价格，其回应会改变我们的留存与利润率。推荐行动前比较可信的回应。",
      "expected_route": "game-theory",
      "expected_behavior": "route",
      "decisive_features": [
        "interacting_actors",
        "choose"
      ],
      "rationale": "请求明确了相互依赖的定价行动并要求回应分析。路由应显示利润率与留存的证据，而非编造收益表或概率。"
    },
    {
      "id": "game-theory-positive-2",
      "kind": "positive",
      "prompt": "我们正在谈判多年供应合同。我们的采购量承诺可能降低供应商成本，但若预测薄弱，供应商可优先其他买家。梳理激励、信息和可信承诺。",
      "expected_route": "game-theory",
      "expected_behavior": "route",
      "decisive_features": [
        "interacting_actors",
        "choose"
      ],
      "rationale": "双方均可调整，收益取决于对方承诺。请求提供的是结构假设而非已验证成本，须标记假设与不确定性。"
    },
    {
      "id": "game-theory-positive-3",
      "kind": "positive",
      "prompt": "两家平台考虑共同的互操作标准。采用能为双方创造价值，但任一平台可能等另一方先承担整合成本。分析可能回应，以及使合作可信的设计行动。",
      "expected_route": "game-theory",
      "expected_behavior": "route",
      "decisive_features": [
        "interacting_actors",
        "choose"
      ],
      "rationale": "决策依赖双方采用和先行成本。条件性稳定结果可能有用，但激励未获支持前不得称为均衡。"
    },
    {
      "id": "game-theory-negative-1",
      "kind": "negative",
      "prompt": "通过比较延迟、存储成本和工程能力，选择内部数据库。没有其他行动者能改变结果。",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "no_meaningful_interdependence"
      ],
      "rationale": "环境固定，没有参与者的回应影响结果。没有战略相互依赖，因此不应路由到此方法。"
    },
    {
      "id": "game-theory-negative-2",
      "kind": "negative",
      "prompt": "评估可能影响我们进入该市场的政治、经济、社会、技术、环境和法律力量。",
      "expected_route": "pestel-analysis",
      "expected_behavior": "route",
      "decisive_features": [
        "macro_environment",
        "forecast"
