      "decisive_features": [
        "mechanical"
      ],
      "rationale": "输入已提供，结果是机械计算，不需要建模其他行动者的回应。"
    },
    {
      "id": "game-theory-explicit-1",
      "kind": "explicit",
      "prompt": "用博弈论分析这次采购拍卖。显示参与者、行动、信息、时序及任何条件性稳定结果，但不编造缺失收益。",
      "expected_route": "game-theory",
      "expected_behavior": "explicit_primary",
