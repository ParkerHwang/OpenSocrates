      "prompt": "Nous devons choisir entre un nouveau service et la référence actuelle. Le registre financier donne les coûts de mise en œuvre et d'exploitation, le rapport pilote l'adoption mesurée ; la question principale est si les bénéfices justifient les coûts sur l'horizon indiqué.",
