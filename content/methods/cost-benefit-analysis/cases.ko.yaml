schema: opensocrates.method-cases/1.0.0
cases:
  - id: cost-benefit-analysis-positive-1
    kind: positive
    prompt: "현재 기준선과 새 서비스 중 하나를 선택해야 합니다. 재무 장부에는 도입·운영 비용이 있고 파일럿 보고서에는 측정된 이용률이 있습니다. 정해진 기간 동안 편익이 비용을 정당화하는지가 핵심 질문입니다."
    expected_route: cost-benefit-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - multiple_objectives
    rationale: "기준선과 여러 선택지가 분명하고 중요한 편익과 비용에 식별 가능한 출처가 있습니다. 비화폐 효과는 따로 남길 수 있지만 비교는 결정과 직접 연결됩니다."
  - id: cost-benefit-analysis-positive-2
    kind: positive
    prompt: "아무것도 하지 않는 경우와 비교해 두 공중보건 사업을 평가해 주세요. 행정 기록에는 제공 비용이 있고 평가 보고서에는 측정된 결과가 있습니다. 누가 비용을 부담하고 누가 편익을 얻는지, 안전·형평성 효과 중 무엇이 돈으로 줄어들지 않는지도 보여 주세요."
    expected_route: cost-benefit-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - practical_consequence
    rationale: "기준선이 있는 경제적 비교와 분배·보상 불가 가치가 함께 요청되었습니다. 결과 근거는 확정값이 아니라 출처가 표시된 자료로 취급해야 합니다."
  - id: cost-benefit-analysis-positive-3
    kind: positive
    prompt: "교체 사업에는 초기 비용과 서로 다른 시점에 발생하는 편익이 있습니다. 승인된 계획 기간과 조직의 문서화된 할인 규칙을 사용하고, 근거가 있는 가정 범위 안에서 바뀔 때 함의가 어떻게 달라지는지 보여 주세요."
    expected_route: cost-benefit-analysis
    expected_behavior: route
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - sensitive_inputs
    rationale: "시점, 계산 경계, 출처가 있는 가정의 민감도가 있어 비용편익 비교에 적합합니다. 기본 할인율이나 꾸며낸 확실성을 요구하지 않습니다."
  - id: cost-benefit-analysis-negative-1
    kind: negative
    prompt: "안전 규정이 모든 시설에 검사 한 단계를 의무화했습니다. 팀은 그 단계를 생략해도 법적으로 허용되는지 묻고 있으며, 통제하는 문구가 결정적인 근거입니다. 재량 있는 대안은 없습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - judgment
      - explicit_rules
      - single_feasible_option
      - binding_rule_without_discretion
    rationale: "재량 없는 의무와 규정의 질문입니다. 순편익 계산으로 구속력 있는 요건을 거래해서는 안 됩니다."
  - id: cost-benefit-analysis-negative-2
    kind: negative
    prompt: "신뢰성, 접근성, 생태 영향, 이용자 존엄성을 기준으로 세 설계안을 고르고 싶습니다. 존엄성은 화폐화하지 않겠고 다른 기준에도 방어 가능한 가격이 없습니다. 대신 기준을 명시한 투명한 비교를 원합니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - multiple_objectives
      - no_coherent_dimensions
    rationale: "가족 혼동 가능성이 큰 trade-off-analysis 사례입니다. 억지로 화폐 총액을 만들기보다 명시적 기준과 보상 불가 제약을 비교해야 합니다."
  - id: cost-benefit-analysis-mechanical-1
    kind: mechanical
    prompt: "이미 검증된 비용과 편익에 제공된 스프레드시트 식을 적용해 산술 합계만 반환해 주세요. 선택, 기준선 판단, 불확실성, 추천은 요청하지 않습니다."
    expected_route: null
    expected_behavior: no_route
    decisive_features:
      - mechanical
    rationale: "재량 있는 비교가 없는 고정 계산입니다. 기계적 계산 경로가 식을 처리하는 동안 이 방법은 조용히 있어야 합니다."
  - id: cost-benefit-analysis-explicit-1
    kind: explicit
    prompt: "이 보조금 결정에 cost-benefit-analysis를 사용해 주세요. 문서화된 기준선과 지원안을 비교하고 분배 효과를 보이며, 근거 없는 가치 평가는 채우지 말고 보류해 주세요."
    expected_route: cost-benefit-analysis
    expected_behavior: explicit_primary
    decisive_features:
      - explicit_method
      - choose
      - multiple_options
    rationale: "사용자가 방법을 명시적으로 호출했고 필요한 비교 표면도 지정했습니다. 근거 없는 값은 가정됨 또는 검증되지 않음으로 남기면서 이 방법을 우선합니다."
  - id: cost-benefit-analysis-insufficiency-1
    kind: insufficiency
    prompt: "두 사업 중 어느 쪽이 더 나은지 말해 주세요. 합의된 기준선도 기간도 비용 기록도 없고 편익에 관한 홍보성 주장만 있습니다."
    expected_route: null
    expected_behavior: hold
    decisive_features:
      - judgment
      - choose
      - multiple_options
      - decisive_input_missing
    rationale: "결정을 바꿀 기준선과 핵심 입력이 없고 편익 주장에도 출처가 없습니다. 가장 작은 결정적 보완만 요청하고 보류해야 합니다."
