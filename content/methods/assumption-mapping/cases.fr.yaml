    {
      "id": "assumption-mapping-positive-1",
      "kind": "positive",
      "prompt": "Nous envisageons un service partagé de planification des repas. Listez les hypothèses nécessaires, séparez importance et éléments probants, puis identifiez le premier test sûr. Les notes d'entretien viennent de l'utilisateur et n'ont pas été vérifiées indépendamment.",
      "expected_route": "assumption-mapping",
      "expected_behavior": "route",
      "decisive_features": [
        "hidden_assumptions",
        "prioritized_assumptions",
        "testable_claim",
        "plan"
      ],
      "rationale": "La demande exige explicitement un registre d'hypothèses, les axes importance/éléments probants, l'ensemble le plus risqué et un prochain test. Les notes d'entretien sont fournies par l'utilisateur et non vérifiées ; l'orientation doit exposer cette incertitude sans attribuer de probabilités."
    },
    {
      "id": "assumption-mapping-positive-2",
      "kind": "positive",
      "prompt": "Une équipe souhaite automatiser l'examen des factures, mais ignore si le blocage porte sur la désirabilité client, la faisabilité des données ou la viabilité réglementaire. Cartographiez les hypothèses et choisissez une validation à faible exposition avant l'achat.",
      "expected_route": "assumption-mapping",
      "expected_behavior": "route",
      "decisive_features": [
        "hidden_assumptions",
        "prioritized_assumptions",
        "irreversible_choice",
        "testable_claim"
      ],
      "rationale": "Plusieurs domaines d'hypothèses et une décision avant engagement sont présents. La validation demandée reste une question de priorité ; le résultat doit distinguer faits étayés, hypothèses et éléments réglementaires manquants."
    },
    {
      "id": "assumption-mapping-positive-3",
      "kind": "positive",
      "prompt": "Nous avons cinq expériences proposées pour modifier les plannings de bénévoles. Classez les hypothèses selon leur importance décisionnelle et la solidité des éléments, puis ajoutez une observation sûre et une règle de modification du plan.",
      "expected_route": "assumption-mapping",
      "expected_behavior": "route",
      "decisive_features": [
        "prioritized_assumptions",
        "testable_claim",
        "chosen_plan"
      ],
      "rationale": "L'utilisateur demande la hiérarchisation centrale de la méthode, pas une expérience accomplie. Le résultat peut employer des niveaux ordinaux et marquer les éléments comme vérifiés, non vérifiés, supposés ou conflictuels, sans scores inventés."
    },
    {
      "id": "assumption-mapping-negative-1",
      "kind": "negative",
      "prompt": "Notre service de paiement a échoué trois fois cette semaine. Retracez la chaîne causale, identifiez les faiblesses de contrôle et attribuez un responsable de prévention ; ne proposez pas de carte d'hypothèses produit.",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "recurring_failure",
        "causal_question",
        "diagnose"
      ],
      "rationale": "Il s'agit d'une demande de root-cause-analysis, confusion de famille probable avec la cartographie d'hypothèses. Le résultat requis est un diagnostic causal et une action de contrôle, pas un ensemble hiérarchisé de croyances testables."
    },
    {
      "id": "assumption-mapping-negative-2",
      "kind": "negative",
      "prompt": "Nous avons déjà choisi un client cible et une expérience sur une page d'accueil. Définissez la mesure exploitable, la fenêtre d'observation et la règle de pivot ou de poursuite.",
      "expected_route": null,
      "expected_behavior": "no_route",
      "decisive_features": [
        "testable_hypothesis",
        "chosen_plan",
        "plan"
