    {
      "id": "assumption-mapping-explicit-1",
      "kind": "explicit",
      "prompt": "Utilisez la cartographie d'hypothèses pour cette idée. Montrez hypothèses, axes importance/éléments probants, ensemble le plus risqué et prochain test sûr ; gardez les affirmations sans soutien visiblement non vérifiées.",
