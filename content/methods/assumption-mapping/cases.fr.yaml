    {
      "id": "assumption-mapping-insufficiency-1",
      "kind": "insufficiency",
      "prompt": "Hiérarchisez les hypothèses de notre proposition et dites laquelle tester d'abord. Aucune question de décision, aucun résultat souhaité, aucune hypothèse candidate ni contrainte de test ne sont encore disponibles.",
