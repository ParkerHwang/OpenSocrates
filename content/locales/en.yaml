    "onboarding.title": "OpenSocrates checks important judgments.",
    "onboarding.body": "It avoids routine edits and file work. For decisions and analyses, it labels verified, calculated, inferred, assumed, unverified, or in conflict—and what could change the conclusion.\n{quiet}: just improve the answer · {together}: show what matters (default) · {strict}: check every material claim.\nPublic grounds and safe source links can be saved locally as a trace. OpenSocrates does not save prompts, raw tool results, or hidden model thoughts, and does not upload traces. Say “don’t save traces” anytime.",
