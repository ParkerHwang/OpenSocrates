    "message.mechanical": "이 대상은 기계적 작업이므로 추론 방법이 필요하지 않습니다.", "message.invalid_route": "경로를 검증할 수 없습니다. 공통 증거 및 카드 규칙으로 계속합니다.",
    "onboarding.title": "OpenSocrates는 중요한 판단을 확인합니다.",
    "onboarding.body": "일상적인 편집과 파일 작업에는 개입하지 않습니다. 결정과 분석에서는 무엇이 검증됨, 계산됨, 추론됨, 가정됨, 미검증 또는 충돌 상태인지, 그리고 무엇이 결론을 바꿀 수 있는지 표시합니다.\n{quiet}: 답변만 다듬기 · {together}: 중요한 점 확인하기(기본값) · {strict}: 중요한 근거를 모두 점검하기.\n공개 근거와 안전한 출처 링크는 기록으로 로컬에 저장할 수 있습니다. OpenSocrates는 프롬프트, 원본 도구 결과 또는 숨겨진 모델 생각을 저장하지 않으며 기록을 업로드하지 않습니다. 언제든지 “기록을 저장하지 마”라고 말할 수 있습니다.",
    "onboarding.prompt_only_limitation": "이 채팅은 결론을 개선하고 표시할 수 있지만, 모든 중간 단계를 지켜보거나 전체 기록을 보관할 수는 없습니다.",
