    "onboarding.title": "OpenSocrates は重要な判断を点検します。",
    "onboarding.body": "日常的な編集やファイル操作には関与しません。意思決定や分析では、検証済み、計算済み、推論による、仮定による、未検証、矛盾ありの状態と、何が結論を変えうるかを表示します。\n{quiet}：回答だけを改善 · {together}：重要な点を表示（既定） · {strict}：重要な主張をすべて点検。\n公開できる根拠と安全な出典リンクは、記録としてローカルに保存できます。OpenSocrates はプロンプト、ツールの生の結果、モデルの隠れた思考を保存せず、記録をアップロードしません。いつでも「記録を保存しないで」と言えます。",
    "onboarding.prompt_only_limitation": "このチャットでは結論を改善して状態を示せますが、すべての中間段階の観察や完全な記録の保持はできません。",
