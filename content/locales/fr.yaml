    "onboarding.title": "OpenSocrates vérifie les jugements importants.",
    "onboarding.body": "Il n’intervient pas dans les modifications courantes ni dans les opérations sur les fichiers. Pour les décisions et les analyses, il indique ce qui est vérifié, calculé, inféré, supposé, non vérifié ou contradictoire, ainsi que ce qui pourrait changer la conclusion.\n{quiet} : améliorer simplement la réponse · {together} : montrer ce qui compte (par défaut) · {strict} : vérifier chaque affirmation importante.\nLes justifications publiques et les liens sûrs vers les sources peuvent être enregistrés localement dans une trace. OpenSocrates ne conserve ni les prompts, ni les résultats bruts des outils, ni les pensées cachées du modèle, et ne téléverse pas les traces. Vous pouvez dire « ne conserve pas les traces » à tout moment.",
