    "onboarding.title": "OpenSocrates comprueba los juicios importantes.",
    "onboarding.body": "No interviene en las ediciones rutinarias ni en el trabajo con archivos. Para decisiones y análisis, distingue lo verificado, calculado, inferido, supuesto, sin verificar o en conflicto, y señala qué podría cambiar la conclusión.\n{quiet}: solo mejora la respuesta · {together}: muestra lo que importa (predeterminado) · {strict}: comprueba cada afirmación relevante.\nLos fundamentos públicos y los enlaces seguros a las fuentes pueden guardarse localmente como una traza. OpenSocrates no guarda prompts, resultados brutos de herramientas ni pensamientos ocultos del modelo, y no sube las trazas. Puedes decir «no guardes trazas» en cualquier momento.",
