    "onboarding.title": "OpenSocrates controlla i giudizi importanti.",
    "onboarding.body": "Non interviene nelle modifiche di routine e nel lavoro sui file. Per decisioni e analisi, distingue ciò che è verificato, calcolato, inferito, assunto, non verificato o in conflitto, e indica che cosa potrebbe cambiare la conclusione.\n{quiet}: migliora soltanto la risposta · {together}: mostra ciò che conta (predefinito) · {strict}: controlla ogni affermazione rilevante.\nI fondamenti pubblici e i collegamenti sicuri alle fonti possono essere salvati localmente in una traccia. OpenSocrates non salva prompt, risultati grezzi degli strumenti o pensieri nascosti del modello, e non carica le tracce online. Puoi dire «non salvare le tracce» in qualsiasi momento.",
