    "onboarding.title": "OpenSocrates 检查重要判断。",
    "onboarding.body": "它不介入日常编辑和文件操作。对于决策和分析，它会标明哪些内容已验证、已计算、已推断、已假设、未验证或存在冲突，以及什么会改变结论。\n{quiet}：只改善回答 · {together}：显示重要事项（默认） · {strict}：检查每项重要主张。\n公开依据和安全的来源链接可以作为记录保存在本地。OpenSocrates 不保存提示词、原始工具结果或模型的隐藏思考，也不上传记录。随时可以说“不要保存记录”。",
