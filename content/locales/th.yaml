    "message.mechanical": "งานเป้าหมายนี้เป็นงานเชิงกล จึงไม่ต้องใช้วิธีให้เหตุผล",
    "message.invalid_route": "ไม่สามารถตรวจสอบการเลือกวิธีได้ ดำเนินต่อด้วยกฎหลักฐานและการ์ดร่วม",
    "onboarding.title": "OpenSocrates ตรวจสอบการตัดสินที่สำคัญ",
    "onboarding.body": "ระบบไม่แทรกแซงการแก้ไขประจำและงานไฟล์ สำหรับการตัดสินและการวิเคราะห์ ระบบกำกับว่าอะไรตรวจสอบแล้ว คำนวณแล้ว อนุมาน ตั้งเป็นสมมติฐาน ยังไม่ได้ตรวจสอบ หรือมีหลักฐานขัดแย้ง รวมทั้งสิ่งที่อาจเปลี่ยนข้อสรุป\n{quiet}: ปรับคำตอบให้ดีขึ้นเท่านั้น · {together}: แสดงสิ่งที่สำคัญ (ค่าเริ่มต้น) · {strict}: ตรวจสอบทุกข้ออ้างที่สำคัญ\nเหตุผลสาธารณะและลิงก์แหล่งข้อมูลที่ปลอดภัยสามารถบันทึกไว้ในเครื่องเป็นบันทึกการตัดสินได้ OpenSocrates ไม่บันทึกพรอมป์ต์ ผลลัพธ์ดิบของเครื่องมือ หรือความคิดภายในของโมเดล และไม่อัปโหลดบันทึก บอกว่า “อย่าบันทึกการตัดสิน” ได้ทุกเมื่อ",
    "onboarding.prompt_only_limitation": "แชตนี้ปรับปรุงและกำกับข้อสรุปได้ แต่ไม่อาจติดตามทุกขั้นตอนระหว่างทางหรือเก็บบันทึกครบถ้วน",
