    "onboarding.title": "OpenSocrates prüft wichtige Urteile.",
    "onboarding.body": "Es greift nicht in routinemäßige Bearbeitungen und Dateioperationen ein. Bei Entscheidungen und Analysen kennzeichnet es, was verifiziert, berechnet, abgeleitet, angenommen, nicht verifiziert oder widersprüchlich ist und was die Schlussfolgerung ändern könnte.\n{quiet}: nur die Antwort verbessern · {together}: Wesentliches zeigen (Standard) · {strict}: jede wesentliche Aussage prüfen.\nÖffentlich darlegbare Gründe und sichere Quellenlinks können lokal als Aufzeichnung gespeichert werden. OpenSocrates speichert weder Prompts noch rohe Werkzeugergebnisse oder verborgene Modellgedanken und lädt keine Aufzeichnungen hoch. Sie können jederzeit „Keine Aufzeichnungen speichern“ sagen.",
