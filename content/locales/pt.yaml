    "onboarding.title": "OpenSocrates verifica julgamentos importantes.",
    "onboarding.body": "Ele evita edições rotineiras e tarefas com arquivos. Para decisões e análises, identifica o que está verificado, calculado, inferido, suposto, não verificado ou em conflito, e o que poderia mudar a conclusão.\n{quiet}: apenas melhorar a resposta · {together}: mostrar o que importa (padrão) · {strict}: verificar cada afirmação relevante.\nFundamentos públicos e links seguros para fontes podem ser salvos localmente como um registro. OpenSocrates não salva prompts, resultados brutos de ferramentas ou pensamentos ocultos do modelo, nem envia os registros. Diga “não salve registros” a qualquer momento.",
