{
  "schema": "opensocrates.card-policy/1.0.0",
  "version": "1.0.0",
  "required_sections": [
    "status",
    "question",
    "conclusion",
    "grounds",
    "evidence",
    "uncertainty",
    "alternatives",
    "flip_condition",
    "next_action"
  ],
  "evidence_states": [
    "unverified",
    "verified",
    "computed",
    "conflicted",
    "not_applicable",
    "not_recorded",
    "unavailable"
  ],
  "statuses": [
    "provisional",
    "supported",
    "held",
    "revised",
    "blocked"
  ],
  "rules": {
    "structured_markdown": true,
    "public_grounds_only": true,
    "conflict_lowers_strength": true,
    "missing_decisive_input_holds": true
