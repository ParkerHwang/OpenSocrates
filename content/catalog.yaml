      },
      "typical_complement": "morphological-analysis"
    },
    {
      "id": "socratic-questioning",
      "family": "framing",
      "display_name": {
        "en": "Socratic Questioning",
        "ko": "\uc18c\ud06c\ub77c\ud14c\uc2a4\uc2dd \uc9c8\ubb38"
      },
      "route_when": {
        "en": "A small number of answers from the user will materially change the route or conclusion",
