        "zh": "概念分析",
        "ja": "概念分析"
      },
      "route_when": {
        "en": "Ambiguous or contested terms carry the decision",
        "ko": "개념 분석",
        "zh": "含义模糊或有争议的术语决定了决策",
        "ja": "曖昧な、または意見が分かれる用語が意思決定を左右する"
      },
      "avoid_when": {
        "en": "Definitions are stable and operational",
        "ko": "개념 분석",
        "zh": "定义已稳定且可用于实际操作",
        "ja": "定義が安定し、実際に使える形になっている"
