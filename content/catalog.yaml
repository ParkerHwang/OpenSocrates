      },
      "avoid_when": {
        "en": "Questions would merely delay an answer that can be bounded",
        "ko": "\uc18c\ud06c\ub77c\ud14c\uc2a4\uc2dd \uc9c8\ubb38"
      },
      "required_public_output": {
        "en": "no more than three decisive questions and why each matters",
        "ko": "\uc18c\ud06c\ub77c\ud14c\uc2a4\uc2dd \uc9c8\ubb38"
      },
      "typical_complement": "assumption-mapping"
    },
    {
      "id": "argument-mapping",
