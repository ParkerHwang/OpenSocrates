      },
      "route_when": {
        "en": "Conventional assumptions block a high-leverage redesign",
        "ko": "\uc81c1\uc6d0\ub9ac \uc0ac\uace0"
      },
      "avoid_when": {
        "en": "Established rules or evidence cannot be safely discarded",
        "ko": "\uc81c1\uc6d0\ub9ac \uc0ac\uace0"
      },
      "required_public_output": {
        "en": "irreducible constraints, derived requirements, assumptions reintroduced",
