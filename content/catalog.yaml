      "route_when": {
        "en": "The result should follow from explicit rules or premises",
        "ko": "\uc5f0\uc5ed\ubc95"
      },
      "avoid_when": {
        "en": "Premises are uncertain and conclusion is empirical",
        "ko": "\uc5f0\uc5ed\ubc95"
      },
      "required_public_output": {
        "en": "premises, rule, conclusion, invalidating premise",
        "ko": "\uc5f0\uc5ed\ubc95"
      },
      "typical_complement": "conceptual-analysis"
    },
    {
      "id": "defeasible-reasoning",
      "family": "logical_reasoning",
      "display_name": {
        "en": "Defeasible Reasoning",
        "ko": "\ud328\ubc30\uac00\ub2a5 \ucd94\ub860"
      },
      "route_when": {
