    {
      "id": "boundary-critique",
      "family": "framing",
      "display_name": {
        "en": "Boundary Critique",
        "ko": "\uacbd\uacc4 \ube44\ud310"
      },
      "route_when": {
        "en": "Included/excluded actors, time horizon, jurisdiction, system edge, or ownership changes the conclusion",
        "ko": "\uacbd\uacc4 \ube44\ud310"
      },
      "avoid_when": {
        "en": "Scope is already explicit and the issue is only comparison",
        "ko": "\uacbd\uacc4 \ube44\ud310"
      },
      "required_public_output": {
        "en": "current boundary, omitted boundary, consequence of changing it",
        "ko": "\uacbd\uacc4 \ube44\ud310"
      },
      "typical_complement": "stakeholder-analysis"
    },
    {
      "id": "conceptual-analysis",
      "family": "framing",
      "display_name": {
        "en": "Conceptual Analysis",
        "ko": "\uac1c\ub150 \ubd84\uc11d"
      },
      "route_when": {
        "en": "Ambiguous or contested terms carry the decision",
        "ko": "\uac1c\ub150 \ubd84\uc11d"
      },
      "avoid_when": {
        "en": "Definitions are stable and operational",
        "ko": "\uac1c\ub150 \ubd84\uc11d"
      },
      "required_public_output": {
        "en": "competing meanings, chosen operational meaning, consequence",
        "ko": "\uac1c\ub150 \ubd84\uc11d"
