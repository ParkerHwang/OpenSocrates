      "avoid_when": {
        "en": "The task is a simple list or direct calculation",
        "ko": "\ub17c\uc99d \uc9c0\ub3c4\ud654"
      },
      "required_public_output": {
        "en": "claim-ground-objection map and unsupported links",
        "ko": "\ub17c\uc99d \uc9c0\ub3c4\ud654"
      },
      "typical_complement": "evidence-hierarchy"
    },
    {
