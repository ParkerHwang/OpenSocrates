  <text style="font-size:13px;fill:#4e6863" x="790" y="1060">진행 중인 관련 작업 포함</text>

  <text style="font-size:14px;fill:#536e68" x="35" y="1094">작업물은 사용자가 접근할 수 있는 앱과 파일에 있습니다.</text>
  <text style="font-size:14px;fill:#536e68" x="35" y="1118">같은 이름의 상자는 같은 요소를 반복 표시합니다. 점선은 필요한 경우의 의뢰입니다.</text>
</svg>
