<svg xmlns="http://www.w3.org/2000/svg" id="data-flow-overview" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#193a38" viewBox="0 0 1080 1140" role="img" aria-labelledby="flowTitle flowDesc" data-mermaid-sha256="b095f0976c6630a7c2aecd228d4e654fa4bcd6c76ce88d0b84a828b4dc8929be">
  <title id="flowTitle">OpenSocrates 2.0 데이터 흐름 요약</title>
  <desc id="flowDesc">계획 단계의 흐름도다. 사용자는 의뢰 세션에서 요청·선택·수정을 전하고 상담과 결과를 받는다. 의뢰 세션은 OpenSocrates 통신·작업 조정과 요청과 결과를 주고받는다. 기본 48개 가이드, 적합한 개인 가이드, 생성 업무에 필요한 공통 생성 지침, 관련 맥락과 권한은 업무별 준비로 들어간다. 앱 어댑터는 각 업무에 맞게 의뢰, 실제 작업, 필요한 학습·재조립 세션에 가이드와 맥락을 전달한다. 실제 작업 세션 A와 B의 질문과 결과는 통신·작업 조정으로 돌아오며, 새 의뢰는 업무별 준비와 앱 어댑터를 거쳐 전달한다. 작업 세션은 허용된 파일을 읽고 쓴다. 관련 작업에서만 파일 변화를 비교하고, 관찰 가능하고 허용된 경험은 프로그램 내 개인별 학습으로 간다. 생성·재조립 결과는 경험 신호와 별도로 통신 계층을 거쳐 학습으로 돌아와 검토된다. 학습은 필요한 경우 개인 가이드를 갱신하거나 관련 업무에서 시험한다. 적합성 판단에는 진행 중인 작업과 이후 작업이 포함된다. 학습은 필요할 때 통신 계층을 통해 추론 세션을 의뢰한다. 개인 DB는 작업·학습 상태와 허용된 참조를 관리한다. 작업물은 사용자가 접근할 수 있는 앱과 파일에 있다. 원문 대화와 작업공간 내용의 복제 보관은 금지된다. 동일한 이름의 상자는 같은 요소를 반복해서 표현한 것이다. 화살표는 설계한 경로이며 실제 전달, 사용 또는 효과가 검증됐다는 뜻이 아니다.</desc>
  <rect width="1080" height="1140" rx="18" fill="#fff"/>
  <text style="font-size:21px;font-weight:750;fill:#123c37" x="35" y="38">요청에서 협업, 경험을 통한 가이드 발전까지</text>
  <text style="font-size:14px;fill:#536e68" x="35" y="63">제품 설계도 · 화살표는 계획된 경로이며 실제 전달·사용의 증거가 아닙니다</text>

